const GUIDES=[
{"id":"getting-started","animal":"dog","category":"Getting started","icon":"🏡","title":"Welcoming a new dog","summary":"A practical plan for your dog's first days: prepare your home, build trust, and settle into a calm routine.","steps":["Before arrival, choose a veterinarian and emergency clinic. Ask the shelter or breeder for vaccination, parasite-treatment, medication and feeding records.","Prepare a quiet resting space, food and water bowls, age-appropriate dog food, safe toys, a leash, a well-fitted collar or harness and an ID tag.","Dog-proof accessible rooms. Secure electrical cords, medications, household chemicals, trash, toxic foods and small objects. Check gates, fencing and door latches.","Bring your dog home using a suitable vehicle restraint or secured travel crate. Keep the first day quiet and let your dog explore a safe area at their own pace.","Offer fresh water and familiar food, and establish predictable mealtimes, bathroom trips, play and sleep. Reward toileting outdoors; never punish accidents.","Arrange a veterinary examination ideally within the first week, sooner if sick. Discuss vaccinations, parasite protection, nutrition, microchipping and age-specific care.","Introduce children and resident pets gradually and under supervision. Let your new dog retreat when uncomfortable; do not force greetings.","Once your dog seems comfortable, begin short, positive-reward sessions for name recognition, settling and basic manners."],"detail":["Take puppies outside frequently, especially after waking, meals and play. Adult dogs may also need extra bathroom opportunities during the adjustment period.","Keep the number of visitors and new experiences modest at first. A dog that seems shy or subdued may need days or weeks to settle.","Never leave young children unsupervised with any dog, even one that appears relaxed and friendly.","For dogs meeting other dogs, begin with controlled, calm introductions; feed separately. Give resident cats a protected space and escape route.","If you use a crate, introduce it gradually with treats and an open door. Never force a fearful dog inside or use confinement as punishment.","Ask the veterinarian about safe socialization and outings for puppies whose vaccine series is not yet complete.","Keep identification and microchip registration details current, and store records where you can find them quickly."],"sections":[{"title":"Your first-day checklist","items":["Show your dog their water, resting spot and designated toilet area. Keep doors, windows and gates secure.","Observe drinking, eating, urination, stool and behavior without overwhelming them.","Offer calm companionship, short walks or gentle play suited to the dog's health and age."]},{"title":"During the first week","items":["Follow the same feeding and bathroom routine each day and note what helps your dog relax.","Practice a few minutes of reward-based training, then allow plenty of rest.","Bring existing health records and a list of questions to your introductory veterinary visit."]},{"title":"When to seek veterinary help","items":["Get urgent veterinary help for trouble breathing, collapse, repeated unproductive retching, severe bleeding, seizures or suspected poisoning.","Call your veterinarian promptly for repeated vomiting, diarrhea, marked lethargy, pain, difficulty urinating or refusal to eat, especially in a young puppy."]}],"sources":["newdog","newpuppy","avmadog"]},
{"id":"getting-started-cat","animal":"cat","category":"Getting started","icon":"🏡","title":"Welcoming a new cat","summary":"Help a new cat or kitten feel secure with a quiet base room, familiar routines and unhurried introductions.","steps":["Before arrival, select a quiet, secure room with a bed, a hiding place, scratching surface, toys, water, suitable cat food and an accessible litter box.","Place the litter box away from food and water. Scoop it daily; for multiple cats, a useful starting point is one box per cat plus one extra, in separate locations.","Cat-proof the room. Secure screens, windows and doors; remove string-like hazards, medications, chemicals and toxic plants, especially lilies.","Bring your cat inside a secure carrier. Set the carrier down in the quiet room, open its door, and let your cat choose when to come out; never pull them out.","Offer familiar food when possible, fresh water and a predictable routine. Avoid forcing handling or introducing many visitors at once.","Book a veterinary visit, ideally within the first week for a kitten or newly adopted cat. Bring records and discuss vaccines, parasite checks, microchipping and feeding.","Keep resident animals separate at first. Gradually exchange scents, then make short, supervised introductions through a secure barrier when both are calm.","Expand access to the home gradually as your cat confidently eats, drinks, uses the litter box and explores. Keep the safe room available as a retreat."],"detail":["Some cats hide after adoption. Provide quiet company and allow them to approach you on their own terms.","A low-sided litter tray may be easier for kittens or cats with mobility limitations. Choose litter appropriate for their age and needs.","Keep scratching posts and elevated resting places available. Provide short, gentle play sessions with cat-safe toys.","Do not leave string, yarn, ribbons or wand toys unattended; swallowing them can cause serious injury.","Never use dog flea or tick products on a cat unless your veterinarian specifically confirms the product is approved for cats.","Have an escape-proof carrier available and store veterinary and microchip information where you can find it.","Introductions may take days or longer. If either pet is frightened or aggressive, return to a safer earlier step and seek professional guidance as needed."],"sections":[{"title":"Your first-day checklist","items":["Go straight to the prepared safe room without introducing resident pets at the doorway.","Show the cat the locations of the litter box, water and resting spot, then give them space to explore.","Check that food and water are available and monitor whether the cat urinates and passes stool."]},{"title":"During the first week","items":["Keep mealtimes, litter cleaning and quiet visits consistent. Expand the territory only when your cat seems ready.","Gradually introduce unfamiliar household sounds, people and pets, without forcing contact.","Discuss preventive care, identification, nutrition and any health concerns at the veterinary visit."]},{"title":"When to seek veterinary help","items":["Seek emergency veterinary care if your cat strains but cannot pass urine, has trouble breathing, collapses, has seizures or may have been poisoned.","Contact a veterinarian promptly if your cat is not eating, repeatedly vomits, has diarrhea, seems in pain or appears unusually weak. Young kittens can deteriorate quickly."]}],"sources":["newkitten","catintroductions","catlitter","newcatsf"]},{"id":"feeding","animal":"dog","category":"Nutrition","icon":"🥣","title":"Feeding and healthy weight for dogs","summary":"Choose appropriate dog food, set sensible meal routines, keep fresh water available, and monitor body condition.","steps":["Keep fresh, clean drinking water available throughout the day. Wash bowls regularly and monitor major changes in drinking.","Choose dog food with a nutritional-adequacy statement saying it is 'complete and balanced' for your dog's life stage; treats and toppers alone are not complete diets.","Match the diet to your dog's needs: puppies need growth nutrition, adults need an appropriate maintenance diet, and pregnant or nursing dogs have additional needs. Ask about large-breed puppy diets if relevant.","Use the package feeding guide as a starting point, not a fixed prescription. Read its calories per cup, can or serving; measure meals and count training treats.","Ask your veterinarian for a target weight, body-condition score and daily feeding plan based on age, size, activity, health and whether your dog is neutered.","Feed on a consistent schedule suited to your dog. Puppies usually require smaller, more frequent meals than healthy adult dogs; ask your veterinarian what is appropriate.","Keep non-complete extras such as treats and table food to no more than roughly 10% of daily calories, unless your veterinarian advises otherwise.","When switching foods, change gradually over several days if your dog is healthy; ask your veterinarian about a tailored plan when illness, allergies or prescription diets are involved."],"detail":["Dog food labels should identify the intended species and life stage; an attractive ingredient list or claims such as 'premium' do not prove that a food is nutritionally adequate.","Check body condition periodically: with a veterinarian's guidance, you should generally be able to feel ribs beneath a light fat covering and see a waist from above.","If your dog gains or loses unexpected weight, discuss feeding amounts and possible health causes with a veterinarian instead of making abrupt or extreme diet changes.","Keep food sealed and stored according to the manufacturer's directions. Refrigerate opened wet food as directed and discard spoiled or contaminated food.","Avoid feeding uncooked meat or bones because of infection, choking and intestinal injury risks. Homemade diets should be formulated with a veterinary nutrition professional.","Do not give vitamins, calcium or other supplements without veterinary advice; excessive or imbalanced nutrients can cause harm.","Common dangerous foods for dogs include chocolate, grapes and raisins, products containing xylitol (also called birch sugar), onions, garlic, alcohol and caffeine. Store these out of reach.","If your dog may have eaten a toxic food, contact a veterinarian or animal poison service right away; do not induce vomiting unless directed by a professional."],"sections":[{"title":"Choosing food by life stage","items":["Puppies: choose a growth diet suitable for your dog's expected adult size and review feeding amounts as they grow.","Adults: choose an appropriate complete maintenance diet and adjust amounts as weight and activity change.","Senior dogs: age alone does not dictate a specific food. Ask your veterinarian about muscle, weight, teeth and any medical conditions."]},{"title":"A simple daily feeding routine","items":["Measure the day's planned food amount; divide it into meals appropriate for your dog.","Set aside some of that food for training rewards or account for any additional treats.","Keep water refreshed and watch for changes in appetite, thirst, vomiting, stool and body weight."]},{"title":"When to call your veterinarian","items":["Call promptly for repeated vomiting or diarrhea, refusal to eat, weight loss, markedly increased thirst or signs of mouth pain.","Seek emergency veterinary care for suspected toxin ingestion, collapse, severe weakness or repeated unproductive retching with a swollen abdomen."]}],"sources":["fdafood","wsavafood","aahafeeding","aahaweight","aspcatoxic"]},
{"id":"feeding-cat","animal":"cat","category":"Nutrition","icon":"🥣","title":"Feeding and healthy weight for cats","summary":"Understand complete cat diets, feeding routines, hydration, treats, and warning signs when appetite changes.","steps":["Keep fresh water available at all times. Provide accessible bowls; some cats drink more readily from multiple stations or a pet fountain.","Select food labeled 'complete and balanced' for cats and the right life stage. Cat food is not interchangeable with dog food; cats need species-specific nutrients.","Choose kitten growth food for growing kittens. Adult, pregnant, nursing, senior and medically complex cats may need different feeding plans—ask your veterinarian.","Use the package feeding directions and calorie information only as a starting estimate; determine the right daily amount with your veterinary team.","Measure total daily food, including wet and dry food, treats and food used for medication. Feed consistently; some cats prefer smaller meals throughout the day.","Consider wet food as part of an appropriate complete diet to increase moisture intake, while keeping clean drinking water available.","Review body condition and weight regularly with your veterinarian. If multiple cats live together, provide separate feeding areas so one cat does not take another's food.","Change foods gradually when practical, but never allow a cat to go without eating for the sake of completing a transition; contact a veterinarian promptly if appetite drops."],"detail":["Cats are obligate carnivores that require nutrients such as taurine; a food formulated for dogs or an unbalanced homemade diet cannot safely replace complete cat food.","Food labels should include the nutritional adequacy statement for the cat's life stage. Marketing words like 'natural' or 'holistic' do not establish nutritional quality.","Keep treats and other foods that are not complete and balanced to about 10% or less of daily calories, unless your veterinarian advises otherwise.","Interactive feeders and puzzle toys may add enrichment when safe and suitable for the cat; they do not replace proper nutrition.","A slow food transition may reduce digestive upset, but cats should not be forced to accept a new food by withholding familiar food.","Avoid raw meat and bones due to infection and injury risks. Do not add vitamin or mineral supplements unless your veterinarian recommends them.","Keep onions, garlic, chocolate, alcohol and caffeine-containing foods away from cats. Ask a veterinarian or poison-control expert immediately about possible exposure.","Store dry and wet foods safely, refrigerate opened canned food as directed, and clean bowls regularly.","A cat that stops eating can become seriously ill; contact a veterinarian promptly rather than waiting several days, particularly for kittens, overweight cats or sick cats."],"sections":[{"title":"Kitten, adult and senior feeding","items":["Kittens: choose a complete food formulated for growth, offer an age-appropriate feeding schedule and monitor growth with your veterinary team.","Adults: use a measured daily food plan and monitor appetite, weight and body condition.","Older cats: ask the veterinarian about body weight, muscle loss, dental disease and medical conditions before changing food."]},{"title":"Daily feeding and hydration checklist","items":["Provide fresh water and serve the day's planned amount of complete cat food.","Record treat portions; keep feeding spots calm and separate in multi-cat households.","Check that your cat is eating and drinking normally, then note any unexpected appetite, weight or litter-box changes."]},{"title":"When to call your veterinarian","items":["Call promptly if your cat stops eating, eats far less than usual, has repeated vomiting or diarrhea, loses weight or drinks noticeably more than usual.","Seek urgent veterinary help for collapse, difficulty breathing, severe weakness or straining without being able to pass urine."]}],"sources":["fdafood","cornellcatfood","wsavafood","aahafeeding","aspcatoxic"]},{"id":"vet","animal":"dog","category":"Health","icon":"🩺","title":"Checkups and prevention for dogs","summary":"Keep your dog healthier with regular veterinary exams, a tailored vaccine plan, parasite protection, and early attention to changes.","steps":["Establish care with a veterinarian before your dog becomes ill. Bring your dog's age, medical records, medication list, diet and questions to each visit.","Schedule preventive exams at an interval recommended for your dog's age and health. Many healthy adults are checked every 6–12 months; puppies need a series of visits, and senior dogs commonly benefit from visits at least twice yearly.","At each checkup, ask about weight, body and muscle condition, teeth, ears, skin, heart, joints, mobility, behavior and nutrition.","Review vaccinations with your veterinarian. Core canine protection includes distemper, adenovirus, parvovirus, leptospirosis and rabies; exact timing and legal rabies requirements depend on vaccine history and local rules.","Discuss other vaccines—such as Bordetella, Lyme disease or canine influenza—based on boarding, dog parks, travel, local disease risks and daily activities.","Ask for an appropriate year-round parasite plan covering heartworm, intestinal worms, fleas and ticks, with testing and product selection based on location, age, weight and medical history.","Confirm microchip details, identification, safe transport, and any reproductive-care decisions with your veterinary team.","Track changes in appetite, water intake, urination, stool, cough, breathing, energy, behavior and mobility. Share changes promptly instead of waiting for the next routine appointment."],"detail":["An exam schedule is individualized: senior dogs and those with chronic disease may need more frequent visits or laboratory tests. Do not start or stop preventive products on your own.","Puppies need multiple veterinary visits for vaccinations, parasite evaluation, growth checks and socialization guidance; your veterinarian should provide the written schedule.","Heartworm can be serious even when dogs look healthy. Follow the prescribed prevention and testing plan; missed doses should be discussed with your veterinarian.","Ticks and fleas can expose animals and people to disease. Inspect the coat after outdoor activity, promptly remove ticks using an appropriate technique, and use only products labeled for the dog's age and weight.","Dental disease may cause painful chewing, drooling or bad breath. Ask the veterinary team about home brushing and professional dental assessment.","For giant and small breeds alike, ask about hereditary risks, orthopedic problems, heart health and the screenings that make sense for your individual dog.","Keep a dated record of vaccine names, booster due dates, parasite prevention, test results, surgeries and medication reactions. Make sure a caregiver can access emergency contacts.","Sudden trouble breathing, collapse, seizures, severe bleeding, a rapidly swollen abdomen with unproductive retching, or suspected poisoning warrant urgent veterinary care."],"sections":[{"title":"Visits by life stage","items":["Puppy: frequent early visits for growth, vaccination series, parasite assessment, nutrition and behavior.","Adult: preventive exams usually every 6–12 months, with timing based on medical history and risk.","Senior: ask about examinations at least every six months plus individualized screening for mobility, pain, organ disease and quality of life."]},{"title":"Questions to bring to your next appointment","items":["Are my dog's vaccinations and parasite prevention up to date for where we live and travel?","Is my dog at a healthy weight? Do I need to change feeding, exercise or dental care?","Do you recommend blood, urine, stool, heartworm or other screening tests based on my dog's age and risks?","What signs should prompt an urgent call, and where is the nearest after-hours emergency clinic?"]},{"title":"When not to wait for a checkup","items":["Seek emergency care for breathing difficulty, collapse, repeated unproductive retching, seizures, major injuries or possible toxin ingestion.","Call a veterinarian promptly for persistent vomiting or diarrhea, difficulty urinating, appetite loss, new lumps, sudden limping, marked thirst or a clear change in behavior."]}],"sources":["caninelife","caninevax","capc","dental"]},
{"id":"vet-cat","animal":"cat","category":"Health","icon":"🩺","title":"Checkups and prevention for cats","summary":"Protect your cat's health with routine exams, individualized vaccines, appropriate parasite control, and careful observation at home.","steps":["Choose a veterinarian who is comfortable handling cats and schedule an introductory exam. Bring vaccination, medication, food, parasite-treatment and adoption records.","Plan a wellness exam at least yearly for most cats; kittens require more frequent early visits, while senior cats often benefit from examinations at least every six months.","At each exam, review body and muscle condition, teeth, skin and coat, heart, kidneys and urinary health, diet, behavior and the litter box.","Discuss a tailored vaccination plan. Common core feline vaccines protect against feline herpesvirus, calicivirus and panleukopenia; rabies vaccination follows applicable recommendations and laws.","Ask about feline leukemia virus (FeLV) vaccination, especially for kittens and at-risk adults. Your veterinarian can discuss FeLV and feline immunodeficiency virus (FIV) testing when indicated.","Review parasite control with your veterinarian even if your cat stays indoors. Fleas, intestinal parasites and heartworm exposures can still occur; use cat-specific products appropriate to age and weight.","Make veterinary visits less stressful: leave the carrier out at home, reward voluntary entry, and ask the clinic about low-stress handling or medication when necessary.","Notice and report changes in appetite, weight, thirst, urination, bowel habits, grooming, vocalization, jumping or hiding; cats often show illness subtly."],"detail":["Indoor cats still need regular preventive examinations, vaccination assessment, dental checks and parasite risk evaluation.","Cats can develop painful dental disease without obvious signs. Ask about brushing, oral checks and appropriate professional care.","Never use a flea or tick product made for dogs on a cat unless a veterinarian explicitly confirms it is labeled and safe for the cat. Some canine products can be life-threatening to cats.","Litter-box changes can signal illness or stress. Frequent trips with little or no urine, especially in a male cat, can indicate a life-threatening urinary blockage.","Older cats can develop kidney disease, high blood pressure, arthritis, thyroid disease or dental problems. Ask which monitoring tests make sense for your cat.","Keep vaccine dates, medical notes, test results, microchip information and the emergency clinic number together.","Check that your cat has reliable access to water, litter boxes, scratching areas, comfortable resting places and opportunities for play.","Difficulty breathing, collapse, seizures, suspected poisoning or inability to urinate require immediate veterinary attention."],"sections":[{"title":"Visits by life stage","items":["Kitten: several early visits for physical exams, growth, parasite evaluation, vaccines and spay/neuter planning.","Adult: at least one wellness exam per year, with extra visits when needed for disease, stress or other concerns.","Senior: preventive exams at least every six months; ask about kidney, thyroid, blood-pressure, pain and mobility assessments."]},{"title":"Questions for the veterinarian","items":["Which vaccines are recommended for my cat's age, health, lifestyle and local rabies rules?","Should my cat be tested for FeLV/FIV, screened for parasites or have blood pressure or laboratory tests?","Is my cat at a healthy weight, and are there dental or behavior issues I should address?","How can I reduce travel and clinic stress, and what signs require emergency care?"]},{"title":"When not to wait for a checkup","items":["Go to an emergency veterinarian immediately if your cat is straining without producing urine, cannot breathe normally, collapses, has a seizure or may have swallowed poison.","Call your veterinarian promptly for reduced appetite or not eating, repeated vomiting, diarrhea, weight loss, increased thirst, painful behavior or unexpected hiding."]}],"sources":["felinelife","felinevax","capc","dental"]},{id:'dental',animal:'both',category:'Grooming',icon:'🪥',title:'Teeth and oral care',summary:'Mouth discomfort is easy to miss, so build a gradual dental-care habit.',steps:['Ask the veterinary team to show you how to introduce brushing.','Use pet-safe toothpaste only; do not use human toothpaste.','Book a dental assessment for bad breath, painful eating, drooling or red gums.'],detail:['Daily brushing is a useful home-care goal, built up patiently over time.','Professional dental cleanings require veterinary assessment and generally anesthesia.','Veterinary Oral Health Council–accepted products may supplement brushing.'],sources:['dental']},
{"id":"grooming","animal":"dog","category":"Grooming","icon":"🛁","title":"Dog grooming: brushing, bathing, nails and ears","summary":"A gentle, practical grooming routine for keeping your dog's coat, paws, nails and ears comfortable.","steps":["Begin each grooming session when your dog is calm. Use treats, praise and short sessions to help them become comfortable with handling. Stop if they are frightened or painful.","Choose a brush or comb designed for your dog's coat. Brush gently in the direction of hair growth, working in small sections; long, curly and double-coated dogs often need more frequent attention.","Check behind the ears, under the legs, around the collar, between the toes and under the tail for tangles, burrs, ticks, irritated skin or lumps.","Bathe when your dog's coat becomes dirty or smelly, or as directed by the veterinarian. Frequency depends on coat type, activity and skin health rather than one universal schedule.","Use lukewarm water, a nonslip surface and shampoo formulated for dogs. Keep shampoo and streams of water away from eyes, nose and ear canals; rinse well and towel-dry thoroughly.","Inspect nails regularly, including dewclaws. If nails click on the floor, curl or snag, ask your groomer or veterinarian about trimming. Introduce the clippers or grinder before attempting a full trim.","Look at the visible part of each ear for redness, odor, pain or discharge. Clean only when needed using a veterinarian-recommended product and technique; never push swabs into the ear canal.","Check paws for cuts, cracked pads, debris and objects between the toes. Wipe muddy paws gently and dry them, especially after walks or baths."],"detail":["For a mild loose tangle, hold hair close to the skin and work gently from the ends with a suitable comb. Do not pull on painful mats.","Never cut tight mats with scissors against the skin: dog skin can be easily caught in a mat. Ask a professional groomer or veterinarian to remove difficult mats safely.","Nail trimming: have a professional demonstrate where the quick (living nail tissue) begins. Trim tiny amounts of the tip, especially on dark nails, and stop before the quick.","If a nail bleeds after trimming, apply gentle pressure and pet-safe styptic powder if available. Contact a veterinarian if bleeding doesn't stop promptly or the nail is badly injured.","Clean skin folds gently if your dog has them, then dry the folds carefully. Red, sore or smelly skin folds require veterinary assessment.","Avoid human shampoo, essential oils, harsh cleaners and unapproved ear treatments. Medicated shampoos and ear products should be used as your veterinarian directs.","A dog that suddenly resists grooming may be painful, anxious or ill. Do not force the procedure; consider a veterinarian or fear-free grooming professional.","Regular dental care matters too. Open the separate 'Teeth and oral care' guide for brushing and professional dental guidance."],"sections":[{"title":"How to brush your dog's coat","items":["Start with a brief, calm session and reward your dog for allowing the brush near their body.","Use a tool suitable for their coat, brush gently in sections and avoid scraping the skin.","Check for mats, parasites, bald spots, redness or unusual lumps; seek professional help for painful tangles.","Give a reward and end before your dog gets overwhelmed. Increase session length gradually."]},{"title":"How to give a safe bath","items":["Brush out loose hair and manageable tangles first. Place a nonslip mat in a tub or wash area and prepare towels.","Wet the coat with comfortably lukewarm water, avoiding the face and ear canals.","Massage in shampoo labeled for dogs. Rinse thoroughly so no irritating residue remains.","Use a damp washcloth for the face. Towel-dry well and keep your dog warm until dry."]},{"title":"Nails, ears and paw-care checklist","items":["Handle a paw briefly, reward your dog, and identify the quick before trimming only the nail tip. Ask for a demonstration if unsure.","Inspect all nails, including dewclaws, and check for painful overgrowth or broken nails.","Observe ears without inserting anything inside; seek veterinary advice for redness, odor, discharge or head shaking.","Look between toes and along paw pads for irritation, injuries or embedded debris."]},{"title":"When to contact a veterinarian or groomer","items":["Make an appointment for painful or tight mats, recurrent skin irritation, significant hair loss, sores, unusual lumps, or ear pain or discharge.","Seek prompt help for a badly torn nail, severe skin pain, an injured eye or significant bleeding.","For a dog that panics, struggles or snaps during grooming, stop and ask about low-stress professional assistance."]}],"sources":["aspcadoggroom","vcadoggroom","dental"]},
{"id":"grooming-cat","animal":"cat","category":"Grooming","icon":"🪮","title":"Cat grooming: brushing, claws, coat and ears","summary":"Keep your cat comfortable with gentle coat care, careful nail trims, and only the bathing they actually need.","steps":["Choose a quiet time when your cat is relaxed. Let them sniff the brush or comb, offer rewards, and start with a few gentle strokes before extending the session.","Brush with a cat-appropriate tool, following the direction of hair growth. Short-haired cats often need less frequent brushing; long-haired cats may need attention every day to prevent matting.","During brushing, check for fleas, ticks, skin redness, wounds, bald patches, lumps and mats, especially behind ears, under armpits and near the hindquarters.","Most healthy cats groom themselves and rarely require routine baths. Ask a veterinarian about bathing if your cat cannot self-groom or has a skin condition.","If a bath is genuinely needed and your cat tolerates handling, use lukewarm water, a nonslip surface and shampoo specifically formulated for cats. Keep water and soap away from the face and ears, rinse well and towel-dry in a warm room.","Check claws regularly. Introduce gentle paw handling first; when the cat is calm, press the toe pad lightly to extend a claw and clip just the sharp transparent tip, away from the pink quick.","Provide sturdy scratching posts or pads in appealing locations. Scratching is natural and helps cats maintain their claws; never punish normal scratching.","Inspect the visible ear surfaces. Healthy ears usually need little cleaning. Redness, odor, head shaking, dark discharge or tenderness should be checked by a veterinarian."],"detail":["For a minor tangle, gently loosen it with fingers or a suitable comb if your cat is comfortable; stop if it pulls or hurts.","Never use scissors to remove close-to-skin mats. Have a groomer or veterinarian address dense mats or a coat that is painfully tangled.","Don't force a struggling cat to accept a bath or nail trim. A veterinarian or professional groomer can help with safe handling and low-stress alternatives.","Never insert cotton swabs into the ear canal or use ear cleaners without veterinary guidance. Cleaning the outer visible flap is different from treating an ear condition.","Cats with arthritis, obesity, dental pain or other illnesses may stop grooming well. A suddenly neglected, greasy or matted coat deserves veterinary attention.","Use only cat-safe shampoos and grooming products. Some products formulated for dogs can be dangerous to cats.","Check claws for overgrowth, especially on senior or less active cats. Curled claws can grow into paw pads and require veterinary treatment.","The separate 'Teeth and oral care' guide explains how to build a gradual, cat-safe dental-care routine."],"sections":[{"title":"How to brush your cat","items":["Offer a short session in a place your cat already finds comfortable. Reward voluntary contact with the brush.","Stroke gently with coat growth; concentrate on one small section at a time and avoid tugging at knots.","Stop if the cat flicks their tail, flattens their ears, hisses, tries to escape or becomes agitated.","For thick mats, irritated skin or repeated grooming resistance, arrange veterinary or professional grooming advice."]},{"title":"How to introduce claw trimming","items":["Practice touching a paw briefly and reward your cat, then release the paw. Repeat over several calm sessions.","Use cat nail clippers. Gently extend one claw and identify the pink quick before clipping only the pointed, translucent tip.","Trim one or two claws if that's all your cat comfortably allows; finish with a treat. Never rush or restrain forcefully.","Have a veterinarian or groomer demonstrate if you can't see the quick or your cat is distressed."]},{"title":"When a bath is necessary","items":["Healthy cats usually do not need regular bathing. Choose a bath only when required for a specific mess or veterinary reason.","Remove safe loose tangles first; use shallow lukewarm water, a nonslip surface and shampoo labeled for cats.","Avoid the face and ear canals, rinse all shampoo away, and dry with towels in a warm, draft-free room.","Stop if your cat becomes extremely distressed and get professional help when needed."]},{"title":"When to call your veterinarian","items":["Make an appointment for sudden excessive grooming or loss of grooming, painful mats, itchy skin, bald patches or sores.","Call for ear discharge, swelling, odor, sensitivity or persistent head shaking, or for overgrown claws digging into pads.","Seek prompt care for significant bleeding, painful injury, or a suspected exposure to an unsafe grooming product."]}],"sources":["aspcacatgroom","vcacatgroom","dental"]},{"id":"enrichment","animal":"dog","category":"Play & toys","icon":"🎾","title":"Playtime and toys for dogs","summary":"Find safe toys, everyday games and exercise ideas for puppies, adults and older dogs, without overdoing it.","steps":["Offer enjoyable play and opportunities to sniff and explore each day. Adapt activity to your dog's health, age, fitness, breed, the weather and what the dog enjoys; there is no single perfect playtime duration.","Combine movement with thinking: leisurely sniff walks, searching for hidden kibble, food puzzles, gentle fetch, tug and short reward-based training games.","Choose toys made for dogs and suited to your dog's size and chewing style. A toy small enough to swallow, or one that sheds chunks, can cause choking or intestinal blockage.","Supervise new toys and all edible chews. Check balls, squeakers, seams and chew toys regularly; remove anything torn, cracked, too small or missing parts.","For a simple 'find it' game, show a piece of your dog's usual kibble, place it nearby, say 'find it', and praise a successful search. Hide it farther away as your dog learns.","For gentle fetch, roll or toss an appropriate soft toy a short distance on a safe surface; reward bringing it back rather than forcing the dog to surrender it.","For tug, use a sturdy appropriately sized tug toy, keep movements controlled, teach a positive 'drop it' exchange, and stop if teeth touch hands or your dog becomes overexcited.","Rotate toys and plan calm rest between sessions. Offer water and end play immediately if your dog limps, coughs, struggles to breathe, becomes overheated or seems reluctant to continue."],"detail":["Sniffing and foraging are meaningful mental activities. A relaxed walk with time to investigate smells may be more suitable than vigorous running for some dogs.","Puppies benefit from many brief, gentle games and naps. Avoid forced endurance running, repeated high jumps and intense twisting while they are growing; discuss exercise limits with your veterinarian.","Healthy adults may enjoy longer walks, retrieving, swimming where safe or structured dog sports after gradual conditioning. Start with shorter sessions when building fitness.","For older dogs or those with arthritis, consider short sniff walks, easy puzzles, soft toys and low-impact games on nonslip surfaces. Ask your veterinarian about pain and safe activity levels.","Avoid exceptionally hard objects, cooked bones and chews that may fracture teeth or splinter. If unsure whether a chew is appropriate, ask your veterinary team.","Account for all treats used in training or food puzzles as part of the daily food allowance. Clean food-dispensing toys according to their instructions.","Dog-to-dog play should be voluntary and supervised with compatible dogs; intervene early when one dog freezes, repeatedly retreats or is being chased without a break.","Keep play gentle in hot or humid conditions. Dogs with short muzzles, heart or respiratory disease, or excess weight may overheat or tire more easily.","If a toy or chew fragment is swallowed, contact a veterinarian immediately for advice, even if your dog seems fine. Do not induce vomiting without veterinary direction."],"sections":[{"title":"Easy game: Find the hidden toy","items":["Let your dog sniff a familiar toy and see you place it a short distance away.","Say 'find it' once. Praise or reward your dog for approaching or locating the toy.","Repeat with slightly harder hiding places while staying within your dog's ability.","End after a few successful rounds; stop if the dog becomes frustrated or stressed."]},{"title":"Easy game: Food puzzle","items":["Choose a sturdy dog-safe feeder that cannot be broken or swallowed by your dog.","Put a small portion of the dog's measured daily kibble inside, and show the dog how it dispenses.","Supervise the first sessions and offer an easier puzzle if your dog becomes frustrated.","Inspect for chewing damage and wash after use; count the food toward daily calories."]},{"title":"Toy choices by life stage","items":["Puppy: appropriately sized puppy-safe rubber or soft toys, gentle chase games and short supervised chew sessions.","Adult: durable size-appropriate retrieval toys, safe food puzzles, sniffing challenges and reward-based play.","Senior: soft easy-to-grip toys, low-effort puzzles and short gentle play sessions suited to mobility and senses."]},{"title":"Toy and play safety checklist","items":["Check toy labels, size, loose parts, torn seams and signs that material could be swallowed.","Keep children from taking toys from a dog's mouth; supervise child–dog interactions.","Offer drinking water and breaks, and avoid hot pavement or strenuous play in heat.","Call a veterinarian for suspected swallowed toy pieces, choking signs, sudden limping or breathing trouble."]}],"sources":["aspcaenrichment","aspcatoys","aspcachewing","aspcapuppyplay"]},
{"id":"enrichment-cat","animal":"cat","category":"Play & toys","icon":"🪶","title":"Playtime and toys for cats","summary":"Encourage safe hunting-style play, climbing and problem-solving for kittens, adult cats and seniors.","steps":["Plan interactive play at times your cat is interested. Many cats prefer several short sessions rather than one long session; adjust to age, health and the individual cat's preferences.","Offer a variety of cat-safe options, such as lightweight balls large enough not to swallow, soft toy mice, sturdy scratchers, tunnels, boxes and supervised wand toys.","Move an interactive wand toy like prey: dart it along the floor, pause, hide it behind furniture, then let your cat stalk, chase, pounce and successfully capture it.","Let the cat catch the toy often and end with a successful catch or another appropriate reward. Do not use your hands or feet as prey toys.","Put away wand toys, ribbons, yarn, thread, string, elastic bands, feathers that detach and other swallowable parts immediately after supervised play.","Try easy food puzzles using a measured portion of your cat's regular diet. Begin with visible food and a simple puzzle before increasing difficulty.","Provide stable vertical perches, resting spots and suitable scratching surfaces. Keep shelves and furniture secure so energetic play does not cause falls.","Rotate a few toys to renew interest. Inspect for loose bells, plastic eyes, damaged seams or small components, and discard unsafe items."],"detail":["Cats have a natural sequence of stalking, chasing, pouncing and capturing. Interactive games are often more rewarding than a toy that moves continuously without allowing a catch.","Kittens may be energetic and mouth toys. Use several brief supervised sessions, redirect bites away from human skin and remove small swallowable items.","Adult cats can enjoy wand play, food searches, boxes, tunnels, climbing and exploration. Some prefer watching before they join in.","Senior cats and cats with mobility difficulties may prefer toys moved slowly along the floor, low climbing platforms, soft toys and short comfortable sessions.","A laser pointer alone does not offer a physical catch and can frustrate some cats. Prefer tangible toys; if using a laser, never shine it into eyes and finish with a real toy or food reward.","Do not leave cats unattended with string, yarn, ribbon, wand-toy lines or toy parts that could be swallowed. If a string is protruding from a cat's mouth or anus, do not pull it; seek veterinary care urgently.","Cardboard boxes and paper bags without handles can be inexpensive play spaces. Remove staples, tape, string and unsafe small parts before offering them.","If you have several cats, arrange separate play opportunities and enough resources so no one animal monopolizes them.","Sudden loss of interest in play, hiding, limping, breathing changes or new reluctance to jump can indicate illness or pain rather than boredom."],"sections":[{"title":"Step-by-step: Hunt and catch","items":["Choose a sturdy supervised wand toy with attachments that cannot readily detach.","Slide it away from your cat in short movements, pausing behind an object as though it were prey.","Let your cat catch and hold it periodically, rather than keeping it out of reach.","End with a successful catch, a small food reward if appropriate, and a calm rest; store the wand out of reach."]},{"title":"Step-by-step: Search for food","items":["Measure a small part of your cat's daily food allowance.","Place the kibble in easy-to-find spots or a simple cat-safe puzzle feeder.","Allow the cat to search and solve the task independently while you supervise.","Increase difficulty gradually and clean the toy after use. Never let the task keep a cat from eating enough."]},{"title":"Toy choices by life stage","items":["Kitten: short supervised wand sessions, lightweight soft toys, safe tunnels and chew-resistant kitten toys.","Adult cat: prey-style toys, puzzle feeders, vertical spaces, scratchers and varied short sessions.","Senior cat: soft toys within easy reach, slow-moving games, low perches and non-slip surfaces."]},{"title":"Play and toy safety checklist","items":["Remove feathers, threads, strings, elastic loops and other parts your cat might swallow.","Check toys for damage, secure climbing furniture, and avoid heights your cat cannot safely manage.","Keep fingers and toes out of bite games; use a toy at a comfortable distance instead.","Contact a veterinarian urgently for swallowed string or toy pieces, choking, persistent vomiting, pain or sudden mobility changes."]}],"sources":["cornelltoys","felineenvironment","cornellsenior","aspcaenrichment"]},{id:'training',animal:'dog',category:'Behavior',icon:'🦴',title:'Positive-reward training',summary:'Teach useful behaviors with short, repeatable practice.',steps:['Reward the behavior you want immediately with praise, food or play.','Start with name recognition, recall, leash manners and settling calmly.','Keep lessons brief and end on an easy success.'],detail:['Use gradual positive exposure to unfamiliar sounds, people and places.','Avoid punishment or intimidation; these can increase fear and make learning harder.','If aggression or severe anxiety occurs, seek qualified veterinary or behavior guidance.'],sources:['dogs']},
{id:'puppy',animal:'dog',category:'Life stages',icon:'🐶',title:'Puppy foundations',summary:'Build confidence, safe social experiences and healthy routines early.',steps:['Arrange puppy veterinary appointments and ask when social outings are appropriate.','Take frequent toilet breaks and reward success.','Provide puppy-safe chewing outlets and gentle supervised social experiences.'],detail:['Avoid crowded, high-risk dog areas before vaccine protection is appropriate.','Introduce alone-time slowly and maintain predictable sleep and feeding routines.','Ask about breed-appropriate growth, diet, and when to begin longer exercise.'],sources:['dogs','aaha']},
{id:'dog-walk',animal:'dog',category:'Daily care',icon:'🦮',title:'Walks and outdoor safety',summary:'Daily outdoor time should be adjusted to the individual dog.',steps:['Use suitable identification, harness or collar, and leash where needed.','Bring water and avoid very hot pavement or extreme weather.','Watch for limping, exhaustion, heavy panting or unusual behavior.'],detail:['A short-nosed, very young, senior or ill dog may tolerate exercise differently.','Check paws and coat after walks for injuries and parasites.','Never leave a dog unattended in a parked vehicle, even briefly.'],sources:['dogs','avma']},
{id:'dog-senior',animal:'dog',category:'Life stages',icon:'🐕',title:'Caring for a senior dog',summary:'Small adjustments can protect comfort and mobility.',steps:['Ask your veterinarian whether more frequent wellness visits are appropriate.','Watch for stiffness, slower rising, new accidents, weight changes or confusion.','Make favorite resting places comfortable and easier to reach.'],detail:['Do not assume new behavioral or mobility changes are “just old age.”','Provide stable footing, accessible water and activity matched to current abilities.','Discuss pain management only with a veterinarian; avoid human pain medicines.'],sources:['aaha','dogs']},
{id:'litter',animal:'cat',category:'Daily care',icon:'🧺',title:'Litter box success',summary:'Clean, accessible litter boxes support feline comfort and behavior.',steps:['Provide accessible litter boxes in quiet, low-stress places.','Scoop waste daily and clean the box regularly.','If your cat strains, urinates outside the box, or produces little urine, contact your veterinarian promptly.'],detail:['A commonly used starting point is one litter box per cat plus one extra, adjusted to the home and cats.','Avoid punishment for accidents; changes can signal illness or environmental stress.','A cat repeatedly trying to urinate but passing no urine needs emergency care.'],sources:['cats','caturine']},
{id:'cat-home',animal:'cat',category:'Behavior',icon:'🧶',title:'An enriching indoor home',summary:'Give cats safe outlets to climb, scratch, hide and hunt through play.',steps:['Offer sturdy scratching surfaces and comfortable hiding places.','Use short interactive play sessions that let your cat chase and capture a toy.','Provide clean food and water stations away from litter boxes.'],detail:['Vertical perches and separate resting spaces can lower conflict in multi-cat homes.','Secure windows and screens; keep household plants and chemicals out of reach.','Avoid strings or wand toys left unattended where they could be swallowed.'],sources:['cats']},
{id:'kitten',animal:'cat',category:'Life stages',icon:'🐈',title:'Kitten care essentials',summary:'Support growth with suitable food, gentle handling and preventive care.',steps:['Feed a complete and balanced kitten diet unless your veterinarian advises otherwise.','Schedule kitten checkups, vaccines and parasite prevention.','Introduce carriers, grooming, toys and visitors gently.'],detail:['Kittens need frequent care and close attention to changes in eating and energy.','Avoid unsupervised access to hair ties, string and small household objects.','Ask the vet about spay/neuter timing and microchipping.'],sources:['cats','aaha']},
{id:'senior-cat',animal:'cat',category:'Life stages',icon:'🐈‍⬛',title:'Senior cat comfort',summary:'Subtle changes in behavior, grooming and appetite deserve attention.',steps:['Discuss twice-yearly wellness visits or a plan tailored to your senior cat.','Offer easy-access food, water, litter boxes and warm resting spots.','Track changes in drinking, weight, jumping, toileting or hiding.'],detail:['Cats can conceal pain; stiffness or reduced grooming is not necessarily normal aging.','Ask your veterinarian about screening for kidney, thyroid, dental and other age-related conditions.','Avoid changing medication or adding supplements without veterinary advice.'],sources:['cats','aaha']}
];
const EMERGENCIES=[
{id:'breathing',icon:'🫁',title:'Trouble breathing or collapse',animal:'both',headline:'Go to an emergency veterinarian now.',signs:'Gasping, blue or pale gums, open-mouth breathing in a cat, collapse or severe weakness.',steps:['Call an emergency veterinary hospital immediately, or have someone call while you travel.','Keep your pet as calm as possible; minimize handling and stress.','Transport safely, keeping the chest and breathing unrestricted.'],avoid:['Do not force food, water or medication.','Do not wait to see whether severe breathing problems resolve.'],sources:['mercktriage','merck']},
{id:'poison',icon:'☠️',title:'Possible poisoning',animal:'both',headline:'Call your veterinarian or animal poison control immediately.',signs:'Possible ingestion or contact with medications, chemicals, toxic plants, chocolate, xylitol or other harmful substances.',steps:['Move your pet away from the suspected substance safely.','Call your veterinarian or ASPCA Animal Poison Control: (888) 426-4435 (consultation fees may apply).','Keep the package, plant name, amount and exposure time available for the professional.'],avoid:['Do not induce vomiting or give home remedies unless a veterinary professional directs you.','Do not wait for symptoms to appear.'],sources:['aspca','vomit']},
{id:'heatstroke',icon:'🌡️',title:'Suspected heatstroke',animal:'both',headline:'Begin cooling and seek emergency veterinary care.',signs:'Excessive panting or distress, weakness, collapse, abnormal gums or overheating.',steps:['Move your pet out of the heat to a shaded, well-ventilated place.','Begin gentle cooling with cool or room-temperature water and moving air while arranging immediate transport.','Call ahead and go to an emergency veterinary hospital, even if the pet seems to improve.'],avoid:['Do not use ice baths or extremely cold water.','Do not force water into a distressed or poorly responsive pet.'],sources:['avma','mercktriage']},
{id:'bleeding',icon:'🩹',title:'Serious bleeding or injury',animal:'both',headline:'For heavy bleeding or major injury, seek emergency care.',signs:'Bleeding that does not stop, deep wounds, severe pain, possible fractures or trauma.',steps:['Protect yourself; frightened or painful animals may bite or scratch.','For external bleeding, apply firm, steady pressure with a clean cloth or gauze if safe.','If soaked, add layers without removing the original dressing; arrange prompt veterinary transport.'],avoid:['Do not remove deeply embedded objects.','Do not give human painkillers or attempt to set a broken bone.'],sources:['avma','merck']},
{id:'seizure',icon:'⚡',title:'Seizure or loss of consciousness',animal:'both',headline:'Contact an emergency veterinarian immediately.',signs:'Uncontrolled shaking, unresponsiveness, repeated seizures, difficulty recovering or collapse.',steps:['Keep your pet away from stairs, sharp objects and other hazards.','Note the time and duration; if safe, record what you observe for the veterinarian.','Call a veterinarian urgently; prolonged, repeated or first-time seizures need prompt assessment.'],avoid:['Do not restrain the pet or place your fingers in its mouth.','Do not give medicines unless directed by a veterinarian.'],sources:['mercktriage','merck']},
{id:'choking',icon:'🆘',title:'Suspected choking',animal:'both',headline:'Get emergency veterinary help immediately.',signs:'Sudden gagging, frantic pawing at mouth, inability to breathe or blue gums.',steps:['Call emergency veterinary care now.','If your pet is conscious and breathing, keep handling gentle and transport urgently.','Only remove an object if it is clearly visible and can be retrieved safely without pushing it deeper or risking a bite.','For life-saving choking maneuvers, follow species-specific Red Cross guidance and seek hands-on training before an emergency.'],avoid:['Do not blindly sweep your fingers into the mouth.','Do not give food or water; even after an object is removed, veterinary examination is needed.'],sources:['dogchoke','catchoke','redcross']},
{id:'urination',icon:'🚽',title:'Cat unable to pass urine',animal:'cat',headline:'This is a life-threatening emergency. Go now.',signs:'Repeated trips to the litter box, straining, crying and producing little or no urine.',steps:['Arrange immediate transport to an emergency veterinarian.','Tell the hospital the cat may have a urinary blockage.','Keep the cat calm in a carrier.'],avoid:['Do not press the belly or try to express the bladder.','Do not wait overnight or assume constipation.'],sources:['caturine','mercktriage']},
{id:'bloat',icon:'🚨',title:'Dog bloating or repeated dry heaving',animal:'dog',headline:'Possible GDV (bloat). Seek emergency care now.',signs:'Swollen or painful abdomen, repeated attempts to vomit without producing much, pacing, weakness.',steps:['Call the nearest emergency veterinary hospital and leave immediately.','Keep the dog calm and avoid delays.','Tell the team when the symptoms began.'],avoid:['Do not try to relieve gas with home treatments.','Do not offer a meal or wait to see if it passes.'],sources:['mercktriage','merck']}
];
const TASKS={dog:[['water','Fresh water','Refresh water and wash the bowl as needed.'],['meals','Meals','Feed the usual veterinarian-guided amount.'],['walk','Walks & toileting','Provide appropriate exercise and toilet breaks.'],['play','Play & connection','Offer safe play, enrichment and calm time.'],['check','Quick wellbeing check','Notice eating, energy, skin, paws and behavior.']],cat:[['water','Fresh water','Refresh water and clean the bowl as needed.'],['meals','Meals','Feed a complete diet suitable for the cat.'],['litter','Litter box','Scoop and notice changes in urination or stool.'],['play','Interactive play','Provide enriching play and quiet retreat options.'],['check','Quick wellbeing check','Notice appetite, grooming, activity and behavior.']]};
const defaults={animal:'dog',stage:'all',category:'All topics',query:'',page:'home',selectedGuide:'',selectedEmergency:'',pets:[],activePet:'',checks:{},contacts:{vet:'',emergency:''}};
let stored={};try{stored=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){}
let state={...defaults,...stored,contacts:{...defaults.contacts,...(stored.contacts||{})},page:'home',selectedGuide:'',selectedEmergency:'',selectedBreed:'',breedQuery:'',query:'',category:'All topics'};
state.pets=Array.isArray(state.pets)?state.pets:[];
state.petTab='overview';state.petStatus='';state.checks=state.checks&&typeof state.checks==='object'?state.checks:{};
if(!['dog','cat'].includes(state.animal))state.animal='dog';
function save(){try{localStorage.setItem(KEY,JSON.stringify({animal:state.animal,stage:state.stage,pets:state.pets,activePet:state.activePet,checks:state.checks,contacts:state.contacts}));return true}catch(e){console.warn('Local browser storage unavailable',e);state.petStatus='Could not save: this browser may be out of storage. Export a backup and try a smaller photo.';return false}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function today(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function selectedPet(){return state.pets.find(x=>x.id===state.activePet)}
function updatePetContext(){const p=selectedPet();if(p)state.animal=p.animal}
function nav(p){state.page=p;state.selectedBreed='';state.selectedGuide='';state.selectedEmergency='';render();window.scrollTo({top:0,behavior:'instant'})}
function animalPicker(){return `<div class="animal-toggle" aria-label="Animal type"><button type="button" data-animal="dog" class="${state.animal==='dog'?'active':''}" aria-pressed="${state.animal==='dog'}">🐶 Dogs</button><button type="button" data-animal="cat" class="${state.animal==='cat'?'active':''}" aria-pressed="${state.animal==='cat'}">🐱 Cats</button></div>`}
function sourceLinks(ids){return `<div class="source-list">${ids.map(id=>SOURCES[id]).filter(Boolean).map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">↗ ${esc(s.name)}</a>`).join('')}</div>`}
function notice(text,kind=''){return `<div class="notice ${kind}"><span aria-hidden="true">${kind==='red'?'🚨':'ℹ️'}</span><p>${text}</p></div>`}
function home(){const p=selectedPet();const preview=GUIDES.filter(g=>g.animal==='both'||g.animal===state.animal).slice(0,3);return `
<div class="hero"><div><span class="eyebrow">A friendlier way to care</span><h1>Better days for every paw. 🐾</h1><p>Simple daily routines, dog and cat care guides, and clear first-aid references when something doesn't seem right.</p><div class="actions"><button class="btn white" data-nav="learn">Explore care guides →</button><button class="btn" style="background:#ffffff20;border-color:#ffffff40" data-nav="pets">${p?'View '+esc(p.name):'Add your pet'}</button></div></div><div class="hero-art" aria-hidden="true">${state.animal==='dog'?'🐕':'🐈'}</div></div>
<div class="section-head"><h2>Who are we caring for?</h2>${animalPicker()}</div>
<div class="grid two"><div class="card"><div class="symbol">${state.animal==='dog'?'🐶':'🐱'}</div><h3>${p?`Hello, ${esc(p.name)}!`:state.animal==='dog'?'Dog care essentials':'Cat care essentials'}</h3><p>${p?`Personalized checklist for your ${p.stage} ${p.animal}.`:'Start with everyday care essentials and create a profile whenever you are ready.'}</p><button class="card-link" data-nav="tracker">Open today’s checklist <span>→</span></button></div><div class="card"><div class="symbol rose">🚑</div><h3>Need help right now?</h3><p>Recognize common emergency warning signs and find next steps from trusted veterinary sources.</p><button class="card-link" data-nav="emergency">Open pet first aid <span>→</span></button></div></div>
<div class="section-head"><h2>Start learning</h2><button class="btn ghost sm" data-nav="learn">See all guides →</button></div><div class="grid">${preview.map(g=>guideCard(g)).join('')}</div>
<div style="margin-top:20px">${notice('Medical and emergency information is general education, not a diagnosis. In an urgent situation, call a veterinarian immediately. Medical pages require independent veterinary review before public release.')}</div>`}
function guideCard(g){return `<article class="card"><div class="symbol">${g.icon}</div><h3>${esc(g.title)}</h3><p>${esc(g.summary)}</p><button class="card-link" data-guide="${g.id}" aria-label="Read ${esc(g.title)}">Read guide <span>→</span></button></article>`}
function learn(){if(state.selectedGuide){const g=GUIDES.find(x=>x.id===state.selectedGuide);if(g)return `<button class="btn ghost sm" data-back="learn">← All guides</button><div style="height:14px"></div><article class="detail-card"><div style="font-size:40px">${g.icon}</div><span class="badge">${esc(g.category)}</span><h2>${esc(g.title)}</h2><p class="lead">${esc(g.summary)}</p><h3>The essentials</h3><div class="stack">${g.steps.map((s,i)=>`<div class="step"><span class="number">${i+1}</span><p>${esc(s)}</p></div>`).join('')}</div><h3>More to know</h3><ul>${g.detail.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>${(g.sections||[]).map(section=>`<h3>${esc(section.title)}</h3><ul>${section.items.map(item=>`<li>${esc(item)}</li>`).join('')}</ul>`).join('')}<div class="divider"></div><h3>Trusted reading</h3>${sourceLinks(g.sources)}<p class="small" style="margin-top:14px">Prepared as an educational starting point; a veterinarian should review content before publication. Last content check: October 2026.</p></article>`}
const cats=['All topics',...new Set(GUIDES.map(g=>g.category))];const entries=GUIDES.filter(g=>(g.animal==='both'||g.animal===state.animal)&&(state.category==='All topics'||g.category===state.category)&&(!state.query||[g.title,g.summary,g.category].join(' ').toLowerCase().includes(state.query.toLowerCase())));return `<div class="subhead"><h2>Care guides for ${state.animal==='dog'?'dogs':'cats'}</h2><p>Practical, compassionate information for everyday care. The recommendations are general; your veterinarian can adapt them to your pet.</p></div><div class="tools">${animalPicker()}<div class="field searchfield"><label for="guide-query">Search topics</label><input id="guide-query" placeholder="Try grooming, feeding, behavior…" value="${esc(state.query)}"></div><button class="btn" data-action="search">Search</button><div class="field smallfield"><label for="category">Category</label><select id="category">${cats.map(c=>`<option ${c===state.category?'selected':''}>${esc(c)}</option>`).join('')}</select></div></div><div class="grid">${entries.map(guideCard).join('')}</div>${entries.length?'':'<div class="empty">No matching guides. Try another word or category.</div>'}`}

function petMessage(t){state.petStatus=t;render()}
function rid(){return 'r-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8)}
function trimmed(form,name,max=220){return String(form.get(name)||'').trim().slice(0,max)}
function petDateOK(v){return /^\d{4}-\d{2}-\d{2}$/.test(v)&&!Number.isNaN(new Date(v+'T12:00:00').getTime())}
async function putPetPhoto(file){
 const p=selectedPet();if(!p)return;
 if(!file||!/^image\/(jpeg|png|webp)$/.test(file.type)||file.size>8*1024*1024){petMessage('Choose a JPEG, PNG or WebP photo smaller than 8 MB.');return}
 try{const src=await new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>resolve(fr.result);fr.onerror=()=>reject(new Error('Cannot read image'));fr.readAsDataURL(file)});
 const img=await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(new Error('Image format not supported'));im.src=src});
 const canvas=document.createElement('canvas');canvas.width=320;canvas.height=320;const ctx=canvas.getContext('2d');if(!ctx)throw Error('Image resizing unavailable');
 const side=Math.min(img.naturalWidth,img.naturalHeight),x=(img.naturalWidth-side)/2,y=(img.naturalHeight-side)/2;ctx.fillStyle='white';ctx.fillRect(0,0,320,320);ctx.drawImage(img,x,y,side,side,0,0,320,320);
 let data=canvas.toDataURL('image/jpeg',0.74);if(data.length>200000)data=canvas.toDataURL('image/jpeg',0.48);if(data.length>220000)throw Error('Photo is too large even after resizing');
 const previous=p.photo;p.photo=data;if(!save()){p.photo=previous;return}
 petMessage('Photo saved for '+p.name+'.');
 }catch(e){petMessage('Could not use that photo: '+(e.message||'unsupported image'))}
}
function bytesToB64(buf){let out='';for(const n of new Uint8Array(buf))out+=String.fromCharCode(n);return btoa(out)}
function b64ToBytes(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function backupKey(password,salt){const raw=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},raw,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function exportPetBackup(){
 const password=document.getElementById('backup-password')?.value||'';
 if(password.length<10){petMessage('Enter a backup password of at least 10 characters.');return}
 if(!crypto?.subtle){petMessage('Encrypted backup is not supported in this browser.');return}
 try{
  const data={version:1,created:new Date().toISOString(),data:{animal:state.animal,stage:state.stage,pets:state.pets,activePet:state.activePet,checks:state.checks,contacts:state.contacts}};
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await backupKey(password,salt);
  const ciphertext=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(data)));
  const envelope={format:'petcare-encrypted-backup',version:1,kdf:'PBKDF2-SHA256',iterations:250000,cipher:'AES-256-GCM',salt:bytesToB64(salt),iv:bytesToB64(iv),payload:bytesToB64(ciphertext)};
  const blob=new Blob([JSON.stringify(envelope)],{type:'application/json'});
  const href=URL.createObjectURL(blob);const a=document.createElement('a');a.href=href;a.download='PetCare-Backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(href),2000);
  petMessage('Encrypted backup downloaded. Keep the file and password in a safe place.');
 }catch(e){petMessage('Unable to create encrypted backup: '+(e.message||'unknown error'))}
}
async function restorePetBackup(){
 const password=document.getElementById('backup-password')?.value||'';
 const file=document.getElementById('backup-file')?.files?.[0];
 if(!file){petMessage('Choose an encrypted backup file first.');return}
 if(!password){petMessage('Enter the password used to create this backup.');return}
 if(file.size>8*1024*1024){petMessage('The backup file exceeds the supported size limit.');return}
 try{
  const env=JSON.parse(await file.text());
  if(env.format!=='petcare-encrypted-backup'||env.version!==1||env.iterations!==250000||env.cipher!=='AES-256-GCM')throw Error('Not a compatible encrypted PetCare backup');
  const salt=b64ToBytes(env.salt),iv=b64ToBytes(env.iv),cipher=b64ToBytes(env.payload);
  if(salt.length!==16||iv.length!==12)throw Error('Backup header is invalid');
  const key=await backupKey(password,salt);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,cipher);
  const payload=JSON.parse(new TextDecoder().decode(plain));const data=payload.data;
  if(payload.version!==1||!data||!Array.isArray(data.pets)||data.pets.length>30||typeof data.checks!=='object'||data.checks===null)throw Error('Backup data is invalid');
  const pets=data.pets.map(p=>{
    if(!p||typeof p.id!=='string'||p.id.length>80||typeof p.name!=='string'||!p.name.trim()||!['dog','cat'].includes(p.animal))throw Error('Invalid pet profile in backup');
    const output={id:p.id,name:p.name.slice(0,45),animal:p.animal,stage:['young','adult','senior'].includes(p.stage)?p.stage:'adult',breed:String(p.breed||'').slice(0,65),birthday:String(p.birthday||'').slice(0,10),sex:String(p.sex||'').slice(0,10),microchip:String(p.microchip||'').slice(0,40)};
    if(typeof p.photo==='string'&&/^data:image\/jpeg;base64,[a-z0-9+/=]+$/i.test(p.photo)&&p.photo.length<220000)output.photo=p.photo;
    for(const k of ['weights','vaccines','visits','meds'])output[k]=Array.isArray(p[k])?p[k].slice(0,300).filter(x=>x&&typeof x==='object').map(x=>({id:String(x.id||rid()).slice(0,80),date:String(x.date||'').slice(0,10),title:String(x.title||'').slice(0,90),value:String(x.value||'').slice(0,20),unit:x.unit==='kg'?'kg':'lb',due:String(x.due||'').slice(0,10),end:String(x.end||'').slice(0,10),notes:String(x.notes||'').slice(0,220)})):[];
    return output;
  });
  const checks={};for(const [k,v] of Object.entries(data.checks).slice(0,4000))if(k.length<=180&&typeof v==='boolean')checks[k]=v;
  const contacts={vet:String(data.contacts?.vet||'').slice(0,32),emergency:String(data.contacts?.emergency||'').slice(0,32)};
  if(!confirm('Restore this backup? This replaces ALL pets, records, photos and checklist data currently saved in this browser.'))return;
  const before={pets:state.pets,activePet:state.activePet,checks:state.checks,contacts:state.contacts,animal:state.animal,stage:state.stage};
  state.pets=pets;state.activePet=pets.some(p=>p.id===data.activePet)?data.activePet:(pets[0]?.id||'');state.checks=checks;state.contacts=contacts;state.animal=['dog','cat'].includes(data.animal)?data.animal:'dog';state.stage=String(data.stage||'all');updatePetContext();state.petTab='overview';
  if(!save()){Object.assign(state,before);petMessage('Restore failed because browser storage is full. Original data retained.');return}
  petMessage('Encrypted backup restored successfully. Review your pets and records.');
 }catch(e){petMessage('Cannot restore backup. Check your password and file. '+(e.message==='OperationError'?'Decryption failed.':String(e.message||'')))}
}

function tracker(){const p=selectedPet();const animal=p?p.animal:state.animal;const prefix=today()+':'+(p?p.id:'sample-'+animal)+':';const tasks=TASKS[animal];const completed=tasks.filter(t=>state.checks[prefix+t[0]]).length;return `<div class="subhead"><h2>✅ Daily care checklist</h2><p>${p?`Today’s care checklist for ${esc(p.name)}.`:`A sample checklist for ${animal}s. Add a pet profile to keep separate checklists for each pet.`}</p></div><div class="card" style="margin-bottom:16px"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><strong>${new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}</strong><span class="badge">${completed} of ${tasks.length} done</span></div><div class="progress" style="margin:13px 0"><span style="width:${Math.round(completed/tasks.length*100)}%"></span></div><p class="small" style="margin:0">Progress is stored locally and resets each new calendar day.</p></div><div class="stack">${tasks.map(t=>`<label class="checkitem ${state.checks[prefix+t[0]]?'done':''}"><input type="checkbox" data-task="${t[0]}" ${state.checks[prefix+t[0]]?'checked':''}><span><strong>${esc(t[1])}</strong><small>${esc(t[2])}</small></span></label>`).join('')}</div><div class="help-actions"><button class="btn outline" data-nav="pets">${p?'Manage pets':'Add your pet'} →</button></div>`}
function sources(){return `<div class="subhead"><h2>📚 Sources & safety</h2><p>Reliable care begins with clear references and knowing when professional advice is needed.</p></div><div class="card"><h3>What this first release does</h3><p>It brings together practical dog and cat care reminders, pet profiles, and easy-to-find emergency references. Medical guidance is summarized conservatively and includes links to primary veterinary resources.</p><h3>What it does not do</h3><p>It cannot diagnose disease, replace a veterinarian, administer treatment, or automatically call emergency services. No medication dosages or unreviewed resuscitation techniques are provided.</p><h3>Review standard</h3><p>Source links checked October 2026. <strong>This prototype has not received an independent review by a licensed veterinarian.</strong> A qualified veterinary reviewer should check every health and emergency page before release; content should be updated and dated when medical recommendations change.</p><h3>Selected references</h3>${sourceLinks(Object.keys(SOURCES))}<div class="divider"></div><h3>Local storage & privacy</h3><p>Pet profiles, photos, birthdays, weight history, vaccination and visit records, medication notes, daily checklists and contact numbers are saved only in this browser using localStorage. There are no accounts or cloud sync. Local browser storage is not encrypted; clearing browser data can erase it. The My Pets page offers an optional password-encrypted downloadable backup for manual restore. Anyone with access to the unlocked browser may still be able to read locally stored records.</p><h3>Future expansion</h3><p>Birds, fish, rabbits, guinea pigs, hamsters, reptiles and other companion animals can be added as separate, species-specific modules after expert review.</p></div>`}

const breedImages={};let breedImagesLoading=false;let breedImagesFinished=false;
function wikiTitle(name){return 'https://en.wikipedia.org/wiki/'+encodeURIComponent(name.replace(/ /g,'_'))}
function breedPhotoBlock(b){return `<div class="breed-image" data-breed-photo="${esc(b.id)}"><span aria-hidden="true">${b.animal==='dog'?'🐕':'🐈'}</span><small>Loading real photograph…</small></div><div class="breed-credit" data-breed-credit="${esc(b.id)}">Images via Wikimedia Commons · credit shown when available</div>`}
function applyBreedPhotos(){document.querySelectorAll('[data-breed-photo]').forEach(el=>{const p=breedImages[el.dataset.breedPhoto];if(!p)return;if(p.url){const img=document.createElement('img');img.src=p.url;img.alt=p.name+' — representative breed photograph';img.loading='lazy';img.referrerPolicy='no-referrer';img.decoding='async';img.onerror=()=>{img.remove();el.insertAdjacentHTML('beforeend','<small>Photograph unavailable. See source link below.</small>')};el.replaceChildren(img)}else{el.querySelector('small')?.replaceChildren(document.createTextNode('Photo unavailable; see breed reference'))}const credit=document.querySelector('[data-breed-credit="'+el.dataset.breedPhoto+'"]');if(credit){credit.replaceChildren();const a=document.createElement('a');a.href=p.fileUrl||wikiTitle(p.wiki);a.target='_blank';a.rel='noopener noreferrer';a.textContent=p.url?'Photo: '+(p.artist||'Wikimedia contributor')+' · '+(p.license||'see license')+' ↗':'View breed reference ↗';credit.appendChild(a)}})}
function plainCredit(s){const d=document.createElement('div');d.innerHTML=String(s||'');return (d.textContent||'').trim().replace(/\s+/g,' ').slice(0,110)}
async function loadBreedPhotos(){if(breedImagesLoading||breedImagesFinished){applyBreedPhotos();return}breedImagesLoading=true;try{const titles=BREEDS.map(b=>b.wiki).join('|');const q='https://en.wikipedia.org/w/api.php?action=query&format=json&formatversion=2&redirects=1&prop=pageimages&piprop=thumbnail%7Cname&pilicense=free&pithumbsize=800&titles='+encodeURIComponent(titles)+'&origin=*';const response=await fetch(q);if(!response.ok)throw Error('Wikipedia photo API unavailable');const data=await response.json();const remap={};for(const r of data.query?.redirects||[])remap[r.from]=r.to;const pages=data.query?.pages||[];const info={};for(const b of BREEDS){const name=remap[b.wiki]||b.wiki;const p=pages.find(x=>x.title.toLowerCase()===name.toLowerCase());if(p?.thumbnail?.source&&p?.pageimage){info[b.id]={url:p.thumbnail.source,name:b.name,wiki:b.wiki,file:'File:'+p.pageimage,fileUrl:'https://commons.wikimedia.org/wiki/File:'+encodeURIComponent(p.pageimage.replace(/ /g,'_')),artist:'',license:''}}else{info[b.id]={name:b.name,wiki:b.wiki}}}const files=[...new Set(Object.values(info).filter(x=>x.file).map(x=>x.file))];if(files.length){try{const metaUrl='https://commons.wikimedia.org/w/api.php?action=query&format=json&formatversion=2&prop=imageinfo&iiprop=extmetadata%7Curl&titles='+encodeURIComponent(files.join('|'))+'&origin=*';const metadataResponse=await fetch(metaUrl);if(metadataResponse.ok){const md=await metadataResponse.json();const byFile={};for(const pg of md.query?.pages||[]){if(pg.imageinfo?.[0])byFile[pg.title.toLowerCase()]=pg.imageinfo[0]}for(const p of Object.values(info)){if(!p.file)continue;const m=byFile[p.file.replaceAll('_',' ').toLowerCase()];if(!m)continue;const ext=m.extmetadata||{};p.artist=plainCredit(ext.Artist?.value||ext.Credit?.value);p.license=plainCredit(ext.LicenseShortName?.value||'');p.fileUrl=m.descriptionurl||p.fileUrl}}}catch(e){console.warn('Photo credit lookup temporarily unavailable',e)}}Object.assign(breedImages,info);breedImagesFinished=true;applyBreedPhotos()}catch(e){console.warn('Breed photographs unavailable',e);for(const b of BREEDS)breedImages[b.id]={name:b.name,wiki:b.wiki};breedImagesFinished=true;applyBreedPhotos()}finally{breedImagesLoading=false}}
function breeds(){const current=BREEDS.find(b=>b.id===state.selectedBreed&&b.animal===state.animal);if(current){const b=current;return `<button class="btn ghost sm" data-back="breeds">← All ${b.animal==='dog'?'dog':'cat'} breeds</button><div class="breed-detail"><div class="breed-hero"><div>${breedPhotoBlock(b)}</div><div><span class="badge">${b.animal==='dog'?'🐶 Dog breed':'🐱 Cat type'}</span><h1>${esc(b.name)}</h1><p class="lead">${esc(b.temperament)}</p><p><strong>Origin:</strong> ${esc(b.origin)}</p><p><strong>Group/type:</strong> ${esc(b.type)}</p><p><strong>Typical adult weight:</strong> ${esc(b.weight)}</p><p><strong>Typical lifespan:</strong> ${esc(b.lifespan)}</p><p class="small">Ranges are approximate and vary with the individual, sex, size, health and lineage.</p></div></div><div class="breed-facts"><section><h3>🎾 Exercise & play</h3><p>${esc(b.exercise)}</p></section><section><h3>🪮 Grooming</h3><p>${esc(b.grooming)}</p></section><section><h3>🏠 Family & other pets</h3><p>${esc(b.family)}</p></section><section><h3>🩺 Health considerations</h3><p>${esc(b.health)}</p></section><section class="full"><h3>💚 Everyday care tip</h3><p>${esc(b.care)}</p></section></div><div class="card" style="margin-top:15px"><h3>Further breed information</h3><p>Temperament describes tendencies, not certainties. Any pet needs individual veterinary care, socialization, supervision and a safe home.</p><div class="source-list"><a href="${esc(wikiTitle(b.wiki))}" target="_blank" rel="noopener noreferrer">↗ Read breed history and photographs</a>${b.akc?'<a href="https://www.akc.org/dog-breeds/'+encodeURIComponent(b.akc)+'/" target="_blank" rel="noopener noreferrer">↗ AKC breed profile</a>':'<a href="https://tica.org/breeds/" target="_blank" rel="noopener noreferrer">↗ TICA cat breed information</a>'}</div></div></div>`}
const search=(state.breedQuery||'').toLowerCase();const matches=BREEDS.filter(b=>b.animal===state.animal&&(!search||[b.name,b.temperament,b.type,b.origin].join(' ').toLowerCase().includes(search))).sort((a,b)=>a.name.localeCompare(b.name));return `<div class="subhead"><h2>🐾 Explore dog & cat breeds</h2><p>Real breed photographs, key characteristics, care needs and important health considerations. Mixed-breed pets are just as welcome.</p></div><div class="breed-controls">${animalPicker()}<div class="field"><label for="breed-query">Find a breed</label><input id="breed-query" placeholder="Search breeds, traits, origins…" value="${esc(state.breedQuery||'')}"></div><button class="btn" data-action="breed-search">Search</button></div><div class="breed-grid">${matches.map(b=>`<article class="breed-card">${breedPhotoBlock(b)}<div class="breed-card-body"><h3>${esc(b.name)}</h3><p>${esc(b.type)} · ${esc(b.temperament)}</p><div class="breed-card-meta">${esc(b.weight)} · ${esc(b.lifespan)}</div><button class="card-link" data-breed="${esc(b.id)}">Explore breed <span>→</span></button></div></article>`).join('')}</div>${matches.length?'':'<div class="empty">No matching breeds. Try another search.</div>'}<p class="small" style="margin-top:18px">Photos are loaded from Wikipedia/Wikimedia and require an internet connection; attribution and license links appear below each available photo. This is an educational guide, not a genetic or veterinary assessment. Breed characteristics and health summaries require specialist review before publication.</p>`}

document.addEventListener('keydown',e=>{if(e.target.id==='breed-query'&&e.key==='Enter'){e.preventDefault();state.breedQuery=e.target.value.trim();render();return}if(e.target.id==='guide-query'&&e.key==='Enter'){e.preventDefault();state.query=e.target.value.trim();render()}});
document.addEventListener('submit',e=>{if(e.target.id==='pet-edit-form'){e.preventDefault();const p=selectedPet();if(!p)return;const f=new FormData(e.target);const name=trimmed(f,'name',45);if(!name){petMessage('Please enter a pet name.');return}const old={...p};p.name=name;p.breed=trimmed(f,'breed',65);p.animal=f.get('animal')==='cat'?'cat':'dog';p.stage=['young','adult','senior'].includes(f.get('stage'))?f.get('stage'):'adult';p.birthday=trimmed(f,'birthday',10);p.sex=['female','male','unknown'].includes(f.get('sex'))?f.get('sex'):'';p.microchip=trimmed(f,'microchip',40);updatePetContext();if(!save()){Object.assign(p,old);return}petMessage(name+"'s profile updated.");return}
if(e.target.id==='pet-record-form'){e.preventDefault();const p=selectedPet();if(!p)return;const f=new FormData(e.target);const kind=String(f.get('kind')||'');if(!['weights','vaccines','visits','meds'].includes(kind))return;const date=trimmed(f,'date',10);if(!petDateOK(date)){petMessage('Please enter a valid date.');return}const title=trimmed(f,'title',90);const value=trimmed(f,'value',20);if(kind==='weights'&&!(Number(value)>0&&Number(value)<=500)){petMessage('Enter a weight between 0.1 and 500.');return}if(kind!=='weights'&&!title){petMessage('Please enter a record name.');return}const item={id:rid(),date,title,value,unit:f.get('unit')==='kg'?'kg':'lb',due:trimmed(f,'due',10),end:trimmed(f,'end',10),notes:trimmed(f,'notes',220)};if(!Array.isArray(p[kind]))p[kind]=[];p[kind].push(item);if(!save()){p[kind].pop();return}petMessage('Saved to '+p.name+"'s "+({weights:'weight history',vaccines:'vaccination history',visits:'vet visits',meds:'medication records'}[kind])+'.');return}
if(e.target.id==='pet-form'){e.preventDefault();const f=new FormData(e.target);const name=String(f.get('name')||'').trim();if(!name)return;const p={id:'p-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7),name:name.slice(0,45),animal:f.get('animal')==='cat'?'cat':'dog',stage:['young','adult','senior'].includes(f.get('stage'))?f.get('stage'):'adult',breed:String(f.get('breed')||'').trim().slice(0,65)};state.pets.push(p);state.activePet=p.id;state.animal=p.animal;state.petTab='overview';if(!save()){state.pets.pop();return}petMessage('Profile created for '+p.name+'.');return}if(e.target.id==='contacts-form'){e.preventDefault();const f=new FormData(e.target);state.contacts.vet=String(f.get('vet')||'').trim().slice(0,32);state.contacts.emergency=String(f.get('emergency')||'').trim().slice(0,32);save();render();return}});
render();
if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script>
</body>
</html>
