ze:13px}.notice{display:flex;gap:12px;align-items:flex-start;background:#fff9e9;border:1px solid #f1deab;border-radius:15px;padding:15px 17px;color:#65512b}.notice strong{display:block;margin-bottom:3px}.notice p{margin:0;font-size:13px}.notice.red{background:var(--rosebg);border-color:#f0c6c1;color:#7c342d}.notice.green{background:#e9f5ed;border-color:#c4e3ce;color:var(--green)}.animal-toggle{display:inline-flex;gap:3px;background:#eef4ee;padding:4px;border-radius:13px;border:1px solid var(--line)}.animal-toggle button{border:0;background:transparent;color:#557367;border-radius:9px;padding:9px 15px;font-weight:850}.animal-toggle button.active{background:white;color:var(--green);box-shadow:0 1px 6px #174d4220}.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:15px 0}.field{min-width:0;display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;font-weight:800;color:#405f52}.field input,.field select,.field textarea,.search{min-height:44px;background:#fff;border:1px solid #c8ddd0;border-radius:11px;padding:11px 12px;color:var(--ink);width:100%}.field textarea{min-height:90px;resize:vertical}.field.searchfield{flex:1 1 270px}.field.smallfield{flex:0 1 190px}.list-card{display:flex;align-items:center;gap:13px;border:1px solid var(--line);background:white;border-radius:14px;padding:14px 15px;text-align:left;width:100%}.list-card:hover{border-color:#70aa94;background:#fcfffd}.list-card .symbol{font-size:27px;flex:0 0 39px}.list-card .copy{flex:1;min-width:0}.list-card strong{display:block;margin-bottom:4px}.list-card p{font-size:12px;margin:0;color:var(--muted)}.list-card .arrow{color:var(--green2);font-weight:800}.badge{font-size:11px;display:inline-flex;border-radius:100px;padding:4px 9px;font-weight:800;color:#2c6652;background:#e7f3ec}.badge.danger{color:#8f3934;background:#ffe5e1}.badge.info{color:#5d577d;background:#edeafa}.stack{display:grid;gap:10px}.detail-card{background:white;border:1px solid var(--line);border-radius:20px;padding:clamp(20px,3vw,33px);box-shadow:var(--shadow)}.detail-card h2{margin:10px 0}.detail-card h3{margin:24px 0 10px;font-size:18px}.detail-card li{margin:7px 0;line-height:1.6}.detail-card ul,.detail-card ol{padding-left:23px}.detail-card .lead{font-size:16px;color:#4a665b;max-width:800px}.detail-card a{font-weight:750}.statstrip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.stat{background:#f0f7f1;border-radius:14px;padding:17px}.stat b{display:block;font-size:26px;color:var(--green)}.stat span{font-size:12px;color:var(--muted)}.checkitem{display:flex;align-items:flex-start;gap:12px;padding:14px;border:1px solid var(--line);border-radius:13px;background:white;cursor:pointer}.checkitem input{height:19px;width:19px;accent-color:var(--green);margin-top:2px}.checkitem span{flex:1}.checkitem small{display:block;color:var(--muted);font-size:12px}.checkitem.done{background:#f0f8f3}.checkitem.done strong{text-decoration:line-through;color:#759086}.pet-tile{display:flex;gap:13px;align-items:center}.pet-face{width:58px;height:58px;flex:0 0 58px;border-radius:17px;background:#e6f5e9;display:grid;place-items:center;font-size:32px}.pet-tile strong{display:block;font-size:18px}.pet-tile span{font-size:12px;color:var(--muted)}.pet-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:13px}.form-panel{max-width:640px}.divider{height:1px;background:var(--line);margin:20px 0}.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.hint{font-size:12px;color:var(--muted)}.empty{border:1px dashed #afcbb7;border-radius:17px;background:#f5faf6;padding:25px;text-align:center;color:var(--muted)}.empty b{display:block;color:var(--ink);font-size:19px;margin-bottom:4px}.footer{padding:24px 0 0;text-align:center;font-size:11px;color:#719182}.footer strong{color:var(--green)}.step{display:flex;gap:11px;align-items:flex-start}.step .number{background:#eaf5ef;color:var(--green);width:28px;height:28px;display:grid;place-items:center;flex:none;border-radius:50%;font-weight:850}.step p{margin:1px 0 9px}.source-list{display:grid;gap:9px}.source-list a{word-break:break-word}.progress{height:11px;border-radius:20px;background:#deebe0;overflow:hidden}.progress span{display:block;height:100%;background:#39a582;border-radius:20px;transition:width .2s}.help-actions{display:flex;flex-wrap:wrap;gap:10px;margin:13px 0 0}
@media(max-width:1040px){.app{grid-template-columns:78px minmax(0,1fr)}.sidebar{padding:24px 9px}.brand{padding:3px 0 26px;justify-content:center}.brandname,.nav button .nav-label,.sidebar-foot{display:none}.nav button{justify-content:center;padding:13px 6px}.nav button span:first-child{font-size:24px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:650px){.app{display:block}.sidebar{position:fixed;top:auto;bottom:0;left:0;right:0;z-index:30;height:auto;background:#174d42;padding:5px 4px max(6px,env(safe-area-inset-bottom));box-shadow:0 -4px 20px #12362a25}.brand,.sidebar-foot{display:none}.nav{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px}.nav button{padding:6px 2px 4px;border-radius:8px;flex-direction:column;gap:0;font-size:9px;line-height:1.2}.nav button span:first-child{font-size:21px}.nav button .nav-label{display:block;font-size:9px;white-space:nowrap}.topbar{padding:0 16px;height:62px}.topbar strong{font-size:13px}.topright .chip{display:none}.shell{padding:18px 13px 110px}.hero{border-radius:19px;padding:25px 20px}.hero-art{font-size:63px}.hero h1{font-size:30px}.hero p{font-size:13px}.grid,.grid.two{grid-template-columns:1fr}.statstrip{gap:7px}.stat{padding:12px 8px}.stat b{font-size:22px}.section-head h2{font-size:19px}.animal-toggle button{padding:8px 11px}.detail-card{padding:18px}}

<body>

<script>
'use strict';
const KEY='pet-care-companion-v1';
const SOURCES={
  merck:{name:'Merck Veterinary Manual · Dog & cat emergencies',url:'https://www.merckvetmanual.com/special-pet-topics/emergencies/what-to-do-in-a-dog-or-cat-emergency'},
  mercktriage:{name:'Merck Veterinary Manual · Emergency assessment',url:'https://www.merckvetmanual.com/special-pet-topics/emergencies/evaluation-and-initial-treatment-of-dog-and-cat-emergencies'},
  aaha:{name:'AAHA · Veterinary preventive-care guidelines',url:'https://www.aaha.org/for-veterinary-professionals/aaha-guidelines/'},
  dental:{name:'AAHA · Your pet’s dental care',url:'https://www.aaha.org/resources/your-pets-dental-care/'},
  cats:{name:'AAHA · Feline life-stage checklists',url:'https://www.aaha.org/resources/2021-aaha-aafp-feline-life-stage-guidelines/life-stage-checklists/'},
  dogs:{name:'AAHA · Canine life-stage checklist',url:'https://www.aaha.org/resources/life-stage-canine-2019/life-stage-checklist/'},
  redcross:{name:'American Red Cross · Pet first aid',url:'https://www.redcross.org/take-a-class/resources/learn-pet-first-aid'},
  dogchoke:{name:'American Red Cross · Dog choking',url:'https://www.redcross.org/take-a-class/resources/learn-pet-first-aid/dog/choking'},
  catchoke:{name:'American Red Cross · Cat choking',url:'https://www.redcross.org/take-a-class/resources/learn-pet-first-aid/cat/choking'},
  aspca:{name:'ASPCA · Animal Poison Control',url:'https://www.aspca.org/pet-care/aspca-poison-control'},
  vomit:{name:'ASPCA · Dangers of inducing vomiting',url:'https://www.aspca.org/news/it-ever-safe-induce-vomiting'},
  avma:{name:'AVMA · Pet first aid brochure',url:'https://ebusiness.avma.org/files/ProductDownloads/mcm-client-brochures-pet-first-aid-2025.pdf'},
  caturine:{name:'VCA · Emergencies in cats',url:'https://vcahospitals.com/know-your-pet/emergencies-in-cats'}
};
const GUIDES=[
{id:'getting-started',animal:'both',category:'Getting started',icon:'🏡',title:'Welcoming a new pet',summary:'A calmer first week starts with a safe space and a predictable routine.',steps:['Prepare a quiet resting space, water, species-appropriate food, identification and safe transport.','Arrange an introductory veterinary visit to review health, vaccines and parasite prevention.','Introduce people, new rooms and other pets gradually; supervise every interaction.'],detail:['Check the home for electrical cords, medications, cleaning products, small chewable objects and escape routes.','Let your pet retreat to a quiet area without being followed or forced to interact.','Build routines around feeding, toileting, play, sleep and gentle handling.'],sources:['aaha','cats','dogs']},
{id:'feeding',animal:'both',category:'Nutrition',icon:'🥣',title:'Food, water and healthy weight',summary:'Choose a complete diet appropriate for your pet’s species and life stage.',steps:['Provide clean drinking water at all times.','Choose dog or cat food labeled complete and balanced for the appropriate life stage.','Ask your veterinarian to help determine meal portions, body condition and special-diet needs.'],detail:['Avoid sudden food changes; transition gradually when your veterinarian recommends a new diet.','Cats need a nutritionally complete feline diet; dog food is not a suitable regular cat diet.','Treats add calories. Keep them modest and adjust main meals appropriately.'],sources:['aaha','cats']},
{id:'vet',animal:'both',category:'Health',icon:'🩺',title:'Checkups and prevention',summary:'Routine examinations help detect problems before they become emergencies.',steps:['Schedule wellness visits at intervals your veterinarian recommends.','Review vaccination plans and parasite prevention based on lifestyle and location.','Tell your veterinarian about changes in appetite, thirst, behavior, weight or energy.'],detail:['Keep vaccine, medication and medical history records together.','Older pets and pets with chronic conditions often need more frequent visits.','Never use a dog parasite product on a cat unless the product and veterinarian explicitly say it is safe for cats.'],sources:['aaha','cats','dogs']},
{id:'dental',animal:'both',category:'Grooming',icon:'🪥',title:'Teeth and oral care',summary:'Mouth discomfort is easy to miss, so build a gradual dental-care habit.',steps:['Ask the veterinary team to show you how to introduce brushing.','Use pet-safe toothpaste only; do not use human toothpaste.','Book a dental assessment for bad breath, painful eating, drooling or red gums.'],detail:['Daily brushing is a useful home-care goal, built up patiently over time.','Professional dental cleanings require veterinary assessment and generally anesthesia.','Veterinary Oral Health Council–accepted products may supplement brushing.'],sources:['dental']},
{id:'grooming',animal:'both',category:'Grooming',icon:'🛁',title:'Brushing, nails and skin',summary:'Make short, positive grooming sessions part of ordinary care.',steps:['Brush based on coat type, checking for mats, sores and parasites.','Inspect nails; ask a groomer or veterinary team to demonstrate safe trimming.','Use species-appropriate products and stop if your pet becomes distressed.'],detail:['A cat that suddenly stops grooming or a dog that develops an itchy, painful skin problem may need examination.','Avoid scissors near tight mats where skin can be trapped.','Introduce handling gradually and use treats or praise, not restraint-based punishment.'],sources:['cats','dogs']},
{id:'enrichment',animal:'both',category:'Behavior',icon:'🧠',title:'Play and enrichment',summary:'Mental stimulation and safe daily activity support wellbeing.',steps:['Offer age- and size-appropriate toys with supervision.','Set aside daily time for interaction, play and calm rest.','Rotate activities to maintain interest, and notice signs of discomfort or stress.'],detail:['Provide both physical and mental activities rather than intense exercise alone.','Enrichment should suit mobility, health and temperament.','Avoid small swallowable toy parts and damaged toys.'],sources:['cats','dogs']},
{id:'training',animal:'dog',category:'Behavior',icon:'🦴',title:'Positive-reward training',summary:'Teach useful behaviors with short, repeatable practice.',steps:['Reward the behavior you want immediately with praise, food or play.','Start with name recognition, recall, leash manners and settling calmly.','Keep lessons brief and end on an easy success.'],detail:['Use gradual positive exposure to unfamiliar sounds, people and places.','Avoid punishment or intimidation; these can increase fear and make learning harder.','If aggression or severe anxiety occurs, seek qualified veterinary or behavior guidance.'],sources:['dogs']},
{id:'puppy',animal:'dog',category:'Life stages',icon:'🐶',title:'Puppy foundations',summary:'Build confidence, safe social experiences and healthy routines early.',steps:['Arrange puppy veterinary appointments and ask when social outings are appropriate.','Take frequent toilet breaks and reward success.','Provide puppy-safe chewing outlets and gentle supervised social experiences.'],detail:['Avoid crowded, high-risk dog areas before vaccine protection is appropriate.','Introduce alone-time slowly and maintain predictable sleep and feeding routines.','Ask about breed-appropriate growth, diet, and when to begin longer exercise.'],sources:['dogs','aaha']},
{id:'dog-walk',animal:'dog',category:'Daily care',icon:'🦮',title:'Walks and outdoor safety',summary:'Daily outdoor time should be adjusted to the individual dog.',steps:['Use suitable identification, harness or collar, and leash where needed.','Bring water and avoid very hot pavement or extreme weather.','Watch for limping, exhaustion, heavy panting or unusual behavior.'],detail:['A short-nosed, very young, senior or ill dog may tolerate exercise differently.','Check paws and coat after walks for injuries and parasites.','Never leave a dog unattended in a parked vehicle, even briefly.'],sources:['dogs','avma']},
{id:'dog-senior',animal:'dog',category:'Life stages',icon:'🐕',title:'Caring for a senior dog',summary:'Small adjustments can protect comfort and mobility.',steps:['Ask your veterinarian whether more frequent wellness visits are appropriate.','Watch for stiffness, slower rising, new accidents, weight changes or confusion.','Make favorite resting places comfortable and easier to reach.'],detail:['Do not assume new behavioral or mobility changes are “just old age.”','Provide stable footing, accessible water and activity matched to current abilities.','Discuss pain management only with a veterinarian; avoid human pain medicines.'],sources:['aaha','dogs']},
{id:'litter',animal:'cat',category:'Daily care',icon:'🧺',title:'Litter box success',summary:'Clean, accessible litter boxes support feline comfort and behavior.',steps:['Provide accessible litter boxes in quiet, low-stress places.','Scoop waste daily and clean the box regularly.','If your cat strains, urinates outside the box, or produces little urine, contact your veterinarian promptly.'],detail:['A commonly used starting point is one litter box per cat plus one extra, adjusted to the home and cats.','Avoid punishment for accidents; changes can signal illness or environmental stress.','A cat repeatedly trying to urinate but passing no urine needs emergency care.'],sources:['cats','caturine']},
{id:'cat-home',animal:'cat',category:'Behavior',icon:'🧶',title:'An enriching indoor home',summary:'Give cats safe outlets to climb, scratch, hide and hunt through play.',steps:['Offer sturdy scratching surfaces and comfortable hiding places.','Use short interactive play sessions that let your cat chase and capture a toy.','Provide clean food and water stations away from litter boxes.'],detail:['Vertical perches and separate resting spaces can lower conflict in multi-cat homes.','Secure windows and screens; keep household plants and chemicals out of reach.','Avoid strings or wand toys left unattended where they could be swallowed.'],sources:['cats']},
{id:'kitten',animal:'cat',category:'Life stages',icon:'🐈',title:'Kitten care essentials',summary:'Support growth with suitable food, gentle handling and preventive care.',steps:['Feed a complete and balanced kitten diet unless your veterinarian advises otherwise.','Schedule kitten checkups, vaccines and parasite prevention.','Introduce carriers, grooming, toys and visitors gently.'],detail:['Kittens need frequent care and close attention to changes in eating and energy.','Avoid unsupervised access to hair ties, string and small household objects.','Ask the vet about spay/neuter timing and microchipping.'],sources:['cats','aaha']},
{id:'senior-cat',animal:'cat',category:'Life stages',icon:'🐈‍⬛',title:'Senior cat comfort',summary:'Subtle changes in behavior, grooming and appetite deserve attention.',steps:['Discuss twice-yearly wellness visits or a plan tailored to your senior cat.','Offer easy-access food, water, litter boxes and warm resting spots.','Track changes in drinking, weight, jumping, toileting or hiding.'],detail:['Cats can conceal pain; stiffness or reduced grooming is not necessarily normal aging.','Ask your veterinarian about screening for kidney, thyroid, dental and other age-related conditions.','Avoid changing medication or adding supplements without veterinary advice.'],sources:['cats','aaha']}
];
const EMERGENCIES=[
{id:'breathing',icon:'🫁',title:'Trouble breathing or collapse',animal:'both',headline:'Go to an emergency veterinarian now.',signs:'Gasping, blue or pale gums, open-mouth breathing in a cat, collapse or severe weakness.',steps:['Call an emergency veterinary hospital immediately, or have someone call while you travel.','Keep your pet as calm as possible; minimize handling and stress.','Transport safely, keeping the chest and breathing unrestricted.'],avoid:['Do not force food, water or medication.','Do not wait to see whether severe breathing problems resolve.'],sources:['mercktriage','merck']},
{id:'poison',icon:'☠️',title:'Possible poisoning',animal:'both',headline:'Call your veterinarian or animal poison control immediately.',signs:'Possible ingestion or contact with medications, chemicals, toxic plants, chocolate, xylitol or other harmful substances.',steps:['Move your pet away from the suspected substance safely.','Call your veterinarian or ASPCA Animal Poison Control: (888) 426-4435 (consultation fees may apply).','Keep the package, plant name, amount and exposure time available for the professional.'],avoid:['Do not induce vomiting or give home remedies unless a veterinary professional directs you.','Do not wait for symptoms to appear.'],sources:['aspca','vomit']},
{id:'heatstroke',icon:'🌡️',title:'Suspected heatstroke',animal:'both',headline:'Begin cooling and seek emergency veterinary care.',signs:'Excessive panting or distress, weakness, collapse, abnormal gums or overheating.',steps:['Move your pet out of the heat to a shaded, well-ventilated place.','Begin gentle cooling with cool or room-temperature water and moving air while arranging immediate transport.','Call ahead and go to an emergency veterinary hospital, even if the pet seems to improve.'],avoid:['Do not use ice baths or extremely cold water.','Do not force water into a distressed or poorly responsive pet.'],sources:['avma','mercktriage']},
{id:'bleeding',icon:'🩹',title:'Serious bleeding or injury',animal:'both',headline:'For heavy bleeding or major injury, seek emergency care.',signs:'Bleeding that does not stop, deep wounds, severe pain, possible fractures or trauma.',steps:['Protect yourself; frightened or painful animals may bite or scratch.','For external bleeding, apply firm, steady pressure with a clean cloth or gauze if safe.','If soaked, add layers without removing the original dressing; arrange prompt veterinary transport.'],avoid:['Do not remove deeply embedded objects.','Do not give human painkillers or attempt to set a broken bone.'],sources:['avma','merck']},
{id:'seizure',icon:'⚡',title:'Seizure or loss of consciousness',animal:'both',headline:'Contact an emergency veterinarian immediately.',signs:'Uncontrolled shaking, unresponsiveness, repeated seizures, difficulty recovering or collapse.',steps:['Keep your pet away from stairs, sharp objects and other hazards.','Note the time and duration; if safe, record what you observe for the veterinarian.','Call a veterinarian urgently; prolonged, repeated or first-time seizures need prompt assessment.'],avoid:['Do not restrain the pet or place your fingers in its mouth.','Do not give medicines unless directed by a veterinarian.'],sources:['mercktriage','merck']},
{id:'choking',icon:'🆘',title:'Suspected choking',animal:'both',headline:'Get emergency veterinary help immediately.',signs:'Sudden gagging, frantic pawing at mouth, inability to breathe or blue gums.',steps:['Call emergency veterinary care now.','If your pet is conscious and breathing, keep handling gentle and transport urgently.','Only remove an object if it is clearly visible and can be retrieved safely without pushing it deeper or risking a bite.','For life-saving choking maneuvers, follow species-specific Red Cross guidance and seek hands-on training before an emergency.'],avoid:['Do not blindly sweep your fingers into the mouth.','Do not give food or water; even after an object is removed, veterinary examination is needed.'],sources:['dogchoke','catchoke','redcross']},
{id:'urination',icon:'🚽',title:'Cat unable to pass urine',animal:'cat',headline:'This is a life-threatening emergency. Go now.',signs:'Repeated trips to the litter box, straining, crying and producing little or no urine.',steps:['Arrange immediate transport to an emergency veterinarian.','Tell the hospital the cat may have a urinary blockage.','Keep the cat calm in a carrier.'],avoid:['Do not press the belly or try to express the bladder.','Do not wait overnight or assume constipation.'],sources:['caturine','mercktriage']},
{id:'bloat',icon:'🚨',title:'Dog bloating or repeated dry heaving',animal:'dog',headline:'Possible GDV (bloat). Seek emergency care now.',signs:'Swollen or painful abdomen, repeated attempts to vomit without producing much, pacing, weakness.',steps:['Call the nearest emergency veterinary hospital and leave immediately.','Keep the dog calm and avoid delays.','Tell the team when the symptoms began.'],avoid:['Do not try to relieve gas with home treatments.','Do not offer a meal or wait to see if it passes.'],sources:['mercktriage','merck']}
];
const TASKS={dog:[['water','Fresh water','Refresh water and wash the bowl as needed.'],['meals','Meals','Feed the usual veterinarian-guided amount.'],['walk','Walks & toileting','Provide appropriate exercise and toilet breaks.'],['play','Play & connection','Offer safe play, enrichment and calm time.'],['check','Quick wellbeing check','Notice eating, energy, skin, paws and behavior.']],cat:[['water','Fresh water','Refresh water and clean the bowl as needed.'],['meals','Meals','Feed a complete diet suitable for the cat.'],['litter','Litter box','Scoop and notice changes in urination or stool.'],['play','Interactive play','Provide enriching play and quiet retreat options.'],['check','Quick wellbeing check','Notice appetite, grooming, activity and behavior.']]};
const defaults={animal:'dog',stage:'all',category:'All topics',query:'',page:'home',selectedGuide:'',selectedEmergency:'',pets:[],activePet:'',checks:{},contacts:{vet:'',emergency:''}};
let stored={};try{stored=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){}
let state={...defaults,...stored,contacts:{...defaults.contacts,...(stored.contacts||{})},page:'home',selectedGuide:'',selectedEmergency:'',query:'',category:'All topics'};
state.pets=Array.isArray(state.pets)?state.pets:[];state.checks=state.checks&&typeof state.checks==='object'?state.checks:{};
if(!['dog','cat'].includes(state.animal))state.animal='dog';
function save(){try{localStorage.setItem(KEY,JSON.stringify({animal:state.animal,stage:state.stage,pets:state.pets,activePet:state.activePet,checks:state.checks,contacts:state.contacts}))}catch(e){console.warn('Local browser storage unavailable',e)}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function today(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function selectedPet(){return state.pets.find(x=>x.id===state.activePet)}
function updatePetContext(){const p=selectedPet();if(p)state.animal=p.animal}
function nav(p){state.page=p;state.selectedGuide='';state.selectedEmergency='';render();window.scrollTo({top:0,behavior:'instant'})}
function animalPicker(){return `<div class="animal-toggle" aria-label="Animal type"><button type="button" data-animal="dog" class="${state.animal==='dog'?'active':''}" aria-pressed="${state.animal==='dog'}">🐶 Dogs</button><button type="button" data-animal="cat" class="${state.animal==='cat'?'active':''}" aria-pressed="${state.animal==='cat'}">🐱 Cats</button></div>`}
function sourceLinks(ids){return `<div class="source-list">${ids.map(id=>SOURCES[id]).filter(Boolean).map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">↗ ${esc(s.name)}</a>`).join('')}</div>`}
function notice(text,kind=''){return `<div class="notice ${kind}"><span aria-hidden="true">${kind==='red'?'🚨':'ℹ️'}</span><p>${text}</p></div>`}
function home(){const p=selectedPet();const preview=GUIDES.filter(g=>g.animal==='both'||g.animal===state.animal).slice(0,3);return `
<div class="hero"><div><span class="eyebrow">A friendlier way to care</span><h1>Better days for every paw. 🐾</h1><p>Simple daily routines, dog and cat care guides, and clear first-aid references when something doesn't seem right.</p><div class="actions"><button class="btn white" data-nav="learn">Explore care guides →</button><button class="btn" style="background:#ffffff20;border-color:#ffffff40" data-nav="pets">${p?'View '+esc(p.name):'Add your pet'}</button></div></div><div class="hero-art" aria-hidden="true">${state.animal==='dog'?'🐕':'🐈'}</div></div>
<div class="section-head"><h2>Who are we caring for?</h2>${animalPicker()}</div>
<div class="grid two"><div class="card"><div class="symbol">${state.animal==='dog'?'🐶':'🐱'}</div><h3>${p?`Hello, ${esc(p.name)}!`:state.animal==='dog'?'Dog care essentials':'Cat care essentials'}</h3><p>${p?`Personalized checklist for your ${p.stage} ${p.animal}.`:'Start with everyday care essentials and create a profile whenever you are ready.'}</p><button class="card-link" data-nav="tracker">Open today’s checklist <span>→</span></button></div><div class="card"><div class="symbol rose">🚑</div><h3>Need help right now?</h3><p>Recognize common emergency warning signs and find next steps from trusted veterinary sources.</p><button class="card-link" data-nav="emergency">Open pet first aid <span>→</span></button></div></div>
<div class="section-head"><h2>Start learning</h2><button class="btn ghost sm" data-nav="learn">See all guides →</button></div><div class="grid">${preview.map(g=>guideCard(g)).join('')}</div>
<div style="margin-top:20px">${notice('Medical and emergency information is general education, not a diagnosis. In an urgent situation, call a veterinarian immediately. Medical pages require independent veterinary review before public release.')}</div>`}
function guideCard(g){return `<article class="card"><div class="symbol">${g.icon}</div><h3>${esc(g.title)}</h3><p>${esc(g.summary)}</p><button class="card-link" data-guide="${g.id}" aria-label="Read ${esc(g.title)}">Read guide <span>→</span></button></article>`}
function learn(){if(state.selectedGuide){const g=GUIDES.find(x=>x.id===state.selectedGuide);if(g)return `<button class="btn ghost sm" data-back="learn">← All guides</button><div style="height:14px"></div><article class="detail-card"><div style="font-size:40px">${g.icon}</div><span class="badge">${esc(g.category)}</span><h2>${esc(g.title)}</h2><p class="lead">${esc(g.summary)}</p><h3>The essentials</h3><div class="stack">${g.steps.map((s,i)=>`<div class="step"><span class="number">${i+1}</span><p>${esc(s)}</p></div>`).join('')}</div><h3>More to know</h3><ul>${g.detail.map(s=>`<li>${esc(s)}</li>`).join('')}</ul><div class="divider"></div><h3>Trusted reading</h3>${sourceLinks(g.sources)}<p class="small" style="margin-top:14px">Prepared as an educational starting point; a veterinarian should review content before publication. Last content check: October 2026.</p></article>`}
const cats=['All topics',...new Set(GUIDES.map(g=>g.category))];const entries=GUIDES.filter(g=>(g.animal==='both'||g.animal===state.animal)&&(state.category==='All topics'||g.category===state.category)&&(!state.query||[g.title,g.summary,g.category].join(' ').toLowerCase().includes(state.query.toLowerCase())));return `<div class="subhead"><h2>Care guides for ${state.animal==='dog'?'dogs':'cats'}</h2><p>Practical, compassionate information for everyday care. The recommendations are general; your veterinarian can adapt them to your pet.</p></div><div class="tools">${animalPicker()}<div class="field searchfield"><label for="guide-query">Search topics</label><input id="guide-query" placeholder="Try grooming, feeding, behavior…" value="${esc(state.query)}"></div><button class="btn" data-action="search">Search</button><div class="field smallfield"><label for="category">Category</label><select id="category">${cats.map(c=>`<option ${c===state.category?'selected':''}>${esc(c)}</option>`).join('')}</select></div></div><div class="grid">${entries.map(guideCard).join('')}</div>${entries.length?'':'<div class="empty">No matching guides. Try another word or category.</div>'}`}
function emergency(){if(state.selectedEmergency){const e=EMERGENCIES.find(x=>x.id===state.selectedEmergency);if(e)return `<button class="btn ghost sm" data-back="emergency">← All emergency topics</button><div style="height:14px"></div><article class="detail-card"><div class="badge danger">🚨 Emergency reference</div><h2>${e.icon} ${esc(e.title)}</h2>${notice(`<strong>${esc(e.headline)}</strong><br>When in doubt, contact an emergency veterinarian.`, 'red')}<h3>Warning signs</h3><p class="lead">${esc(e.signs)}</p><h3>What to do while arranging help</h3><div class="stack">${e.steps.map((s,i)=>`<div class="step"><span class="number">${i+1}</span><p>${esc(s)}</p></div>`).join('')}</div><h3>What not to do</h3><ul>${e.avoid.map(s=>`<li>${esc(s)}</li>`).join('')}</ul><div class="help-actions">${state.contacts.emergency?`<a class="btn warn" href="tel:${esc(state.contacts.emergency.replace(/[^+0-9]/g,''))}">☎ Call your emergency vet</a>`:''}${e.id==='poison'?'<a class="btn warn" href="tel:18884264435">☎ ASPCA Poison Control</a>':''}<button class="btn outline" data-nav="pets">Save vet contact</button></div><div class="divider"></div><h3>Read professional sources</h3>${sourceLinks(e.sources)}<p class="small" style="margin-top:15px">This page is a conservative educational summary, not a complete first-aid or CPR course. Verified links checked October 2026. Veterinary review pending.</p></article>`}
const emergencies=EMERGENCIES.filter(e=>e.animal==='both'||e.animal===state.animal);return `<div class="subhead"><h2>🚑 Pet First Aid</h2><p>Identify urgent warning signs and make safer decisions about getting veterinary care.</p></div>${notice('<strong>If your pet cannot breathe normally, collapses, has severe bleeding, may be poisoned, or cannot pass urine, contact emergency veterinary care immediately.</strong> Do not use this app to delay treatment.','red')}<div class="help-actions" style="margin-bottom:16px">${state.contacts.emergency?`<a class="btn warn" href="tel:${esc(state.contacts.emergency.replace(/[^+0-9]/g,''))}">☎ Emergency vet</a>`:'<button class="btn outline" data-nav="pets">+ Add emergency vet number</button>'}<a class="btn outline" href="tel:18884264435">☎ ASPCA Poison Control</a></div><div class="tools">${animalPicker()}</div><div class="grid two">${emergencies.map(e=>`<button class="list-card" data-emergency="${e.id}"><span class="symbol">${e.icon}</span><span class="copy"><strong>${esc(e.title)}</strong><p>${esc(e.signs)}</p></span><span class="arrow">→</span></button>`).join('')}</div><div style="margin-top:17px">${notice('This feature is an educational prototype. First-aid instructions and emergency language must be reviewed by a licensed veterinarian before this app is released publicly.')}</div>`}
function pets(){const cards=state.pets.map(p=>`<article class="card"><div class="pet-tile"><div class="pet-face">${p.animal==='dog'?'🐶':'🐱'}</div><div><strong>${esc(p.name)}</strong><span>${esc(p.stage)} ${p.animal}${p.breed?' · '+esc(p.breed):''}</span></div></div><div class="pet-actions"><button class="btn sm ${p.id===state.activePet?'soft':'outline'}" data-select-pet="${esc(p.id)}">${p.id===state.activePet?'✓ Current pet':'Select pet'}</button><button class="btn ghost sm" data-remove-pet="${esc(p.id)}">Remove</button></div></article>`).join('');return `<div class="subhead"><h2>🐾 My pets</h2><p>Create a simple pet profile to personalize daily care. Profiles are saved in this browser on this device.</p></div><div class="grid two">${cards||'<div class="empty"><b>No pets added yet.</b>Your first pet profile is only a moment away.</div>'}<div class="card"><h3>➕ Add a pet</h3><form id="pet-form" class="stack"><div class="field"><label for="pet-name">Pet name *</label><input id="pet-name" name="name" maxlength="45" placeholder="e.g. Bailey" required></div><div class="field"><label for="pet-animal">Animal *</label><select id="pet-animal" name="animal"><option value="dog">Dog</option><option value="cat">Cat</option></select></div><div class="field"><label for="pet-stage">Life stage</label><select name="stage" id="pet-stage"><option value="young">Puppy / kitten</option><option value="adult" selected>Adult</option><option value="senior">Senior</option></select></div><div class="field"><label for="pet-breed">Breed (optional)</label><input id="pet-breed" name="breed" maxlength="65" placeholder="Mixed breed is fine"></div><button type="submit" class="btn block">Save pet profile</button></form></div></div><div class="section-head"><h2>Emergency contact numbers</h2></div><div class="card form-panel"><form id="contacts-form" class="stack"><div class="field"><label for="vet-phone">Regular veterinarian phone</label><input id="vet-phone" type="tel" inputmode="tel" name="vet" maxlength="32" value="${esc(state.contacts.vet)}" placeholder="Phone number"></div><div class="field"><label for="emergency-phone">24-hour emergency veterinarian phone</label><input id="emergency-phone" type="tel" inputmode="tel" name="emergency" maxlength="32" value="${esc(state.contacts.emergency)}" placeholder="Phone number"></div><button class="btn" type="submit">Save contacts</button></form><p class="small" style="margin:14px 0 0">Numbers are stored locally in this browser. Confirm an emergency clinic’s opening hours and location in advance.</p></div>${notice('Browser storage is not encrypted or synced. Clearing site data or switching devices may erase pet profiles, saved contacts and checklist progress. Do not store sensitive medical details here.')}`}
function tracker(){const p=selectedPet();const animal=p?p.animal:state.animal;const prefix=today()+':'+(p?p.id:'sample-'+animal)+':';const tasks=TASKS[animal];const completed=tasks.filter(t=>state.checks[prefix+t[0]]).length;return `<div class="subhead"><h2>✅ Daily care checklist</h2><p>${p?`Today’s care checklist for ${esc(p.name)}.`:`A sample checklist for ${animal}s. Add a pet profile to keep separate checklists for each pet.`}</p></div><div class="card" style="margin-bottom:16px"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><strong>${new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}</strong><span class="badge">${completed} of ${tasks.length} done</span></div><div class="progress" style="margin:13px 0"><span style="width:${Math.round(completed/tasks.length*100)}%"></span></div><p class="small" style="margin:0">Progress is stored locally and resets each new calendar day.</p></div><div class="stack">${tasks.map(t=>`<label class="checkitem ${state.checks[prefix+t[0]]?'done':''}"><input type="checkbox" data-task="${t[0]}" ${state.checks[prefix+t[0]]?'checked':''}><span><strong>${esc(t[1])}</strong><small>${esc(t[2])}</small></span></label>`).join('')}</div><div class="help-actions"><button class="btn outline" data-nav="pets">${p?'Manage pets':'Add your pet'} →</button></div>`}
function sources(){return `<div class="subhead"><h2>📚 Sources & safety</h2><p>Reliable care begins with clear references and knowing when professional advice is needed.</p></div><div class="card"><h3>What this first release does</h3><p>It brings together practical dog and cat care reminders, pet profiles, and easy-to-find emergency references. Medical guidance is summarized conservatively and includes links to primary veterinary resources.</p><h3>What it does not do</h3><p>It cannot diagnose disease, replace a veterinarian, administer treatment, or automatically call emergency services. No medication dosages or unreviewed resuscitation techniques are provided.</p><h3>Review standard</h3><p>Source links checked October 2026. <strong>This prototype has not received an independent review by a licensed veterinarian.</strong> A qualified veterinary reviewer should check every health and emergency page before release; content should be updated and dated when medical recommendations change.</p><h3>Selected references</h3>${sourceLinks(Object.keys(SOURCES))}<div class="divider"></div><h3>Local storage & privacy</h3><p>Pet names, optional breeds, checklist completion and phone numbers are saved to this browser using localStorage. This prototype contains no accounts or cloud sync. Browser storage is not encrypted; clearing browser data may erase it. Avoid entering confidential health information.</p><h3>Future expansion</h3><p>Birds, fish, rabbits, guinea pigs, hamsters, reptiles and other companion animals can be added as separate, species-specific modules after expert review.</p></div>`}
const NAV=[['home','🏠','Home'],['learn','📖','Learn'],['emergency','🚑','First Aid'],['tracker','✅','Daily'],['pets','🐾','My Pets'],['sources','📚','Sources']];
function render(){const views={home,learn,emergency,tracker,pets,sources};let content=(views[state.page]||home)();document.getElementById('app').innerHTML=`<aside class="sidebar"><div class="brand"><div class="brandmark">🐾</div><div class="brandname">PetCare<span>MADE SIMPLE</span></div></div><nav class="nav" aria-label="Primary navigation">${NAV.map(([id,icon,name])=>`<button type="button" data-nav="${id}" ${state.page===id?'aria-current="page"':''}><span aria-hidden="true">${icon}</span><span class="nav-label">${name}</span></button>`).join('')}</nav><div class="sidebar-foot"><strong>A DONCO-BAYCITY™ App</strong>Dogs & cats · Prototype 1.0</div></aside><div class="content"><header class="topbar"><strong>🐾 PetCare Made Simple</strong><div class="topright"><span class="chip">🐶 🐱 Dogs & Cats</span><button class="btn outline sm" data-nav="emergency">🚑 Emergency</button></div></header><main class="shell" id="main" tabindex="-1">${content}<footer class="footer">A <strong>DONCO-BAYCITY™</strong> App · Educational prototype · Veterinary review pending</footer></main></div>`;document.title=(state.page==='home'?'PetCare Made Simple':NAV.find(x=>x[0]===state.page)?.[2]+' — PetCare Made Simple')||'PetCare Made Simple'}
document.addEventListener('click',e=>{const t=e.target.closest('[data-nav],[data-animal],[data-guide],[data-emergency],[data-back],[data-select-pet],[data-remove-pet],[data-action]');if(!t)return;if(t.dataset.nav){nav(t.dataset.nav);return}if(t.dataset.back){if(t.dataset.back==='learn')state.selectedGuide='';if(t.dataset.back==='emergency')state.selectedEmergency='';render();window.scrollTo(0,0);return}if(t.dataset.animal){state.animal=t.dataset.animal;state.activePet='';save();render();return}if(t.dataset.guide){state.page='learn';state.selectedGuide=t.dataset.guide;render();window.scrollTo(0,0);return}if(t.dataset.emergency){state.page='emergency';state.selectedEmergency=t.dataset.emergency;render();window.scrollTo(0,0);return}if(t.dataset.selectPet){state.activePet=t.dataset.selectPet;updatePetContext();save();render();return}if(t.dataset.removePet){const p=state.pets.find(x=>x.id===t.dataset.removePet);if(!p)return;if(!confirm('Remove '+p.name+' from this browser?'))return;state.pets=state.pets.filter(x=>x.id!==p.id);if(state.activePet===p.id)state.activePet=state.pets[0]?.id||'';updatePetContext();save();render();return}if(t.dataset.action==='search'){state.query=document.getElementById('guide-query')?.value.trim()||'';render();return}});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='category'){state.category=t.value;render();return}if(t.matches('[data-task]')){const p=selectedPet();const animal=p?p.animal:state.animal;const k=today()+':'+(p?p.id:'sample-'+animal)+':'+t.dataset.task;state.checks[k]=t.checked;save();render();return}});
document.addEventListener('keydown',e=>{if(e.target.id==='guide-query'&&e.key==='Enter'){e.preventDefault();state.query=e.target.value.trim();render()}});
document.addEventListener('submit',e=>{if(e.target.id==='pet-form'){e.preventDefault();const f=new FormData(e.target);const name=String(f.get('name')||'').trim();if(!name)return;const p={id:'p-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7),name:name.slice(0,45),animal:f.get('animal')==='cat'?'cat':'dog',stage:['young','adult','senior'].includes(f.get('stage'))?f.get('stage'):'adult',breed:String(f.get('breed')||'').trim().slice(0,65)};state.pets.push(p);state.activePet=p.id;state.animal=p.animal;save();render();return}if(e.target.id==='contacts-form'){e.preventDefault();const f=new FormData(e.target);state.contacts.vet=String(f.get('vet')||'').trim().slice(0,32);state.contacts.emergency=String(f.get('emergency')||'').trim().slice(0,32);save();render();return}});
render();
if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script>
</body>
