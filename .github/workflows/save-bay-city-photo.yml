name: Save licensed Bay City photo to repository
on:
  push:
    paths:
      - '.github/workflows/save-bay-city-photo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  save-photo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download original CC BY-SA 4.0 photo
        run: |
          mkdir -p icons
          curl --fail --location --retry 3 --user-agent 'PetCare Made Simple asset fetch (GitHub Actions)' 'https://upload.wikimedia.org/wikipedia/commons/0/02/Bay_City%2C_Michigan_%282022%29.jpg' --output icons/bay-city-waterfront.jpg
          test "$(wc -c < icons/bay-city-waterfront.jpg)" -gt 100000
          file icons/bay-city-waterfront.jpg | grep -q 'JPEG image data'
      - name: Commit downloaded image asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/bay-city-waterfront.jpg
          if ! git diff --staged --quiet; then
            git commit -m "Store Bay City skyline photo from Wikimedia Commons locally"
            git push
          fi
